<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" role="img" aria-label="Giftalk">
  <!-- 実画像: 左にギフト箱アウトラインアイコン(リボン付き) + 右に太サンセリフ "Giftalk" -->
  <!-- アイコン部分 (0,0)〜(68,72) -->
  <g transform="translate(4, 8)">
    <!-- ギフト箱の胴体 -->
    <rect x="4" y="30" width="52" height="28" rx="3.5"
      fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- ギフト箱のフタ (帯) -->
    <rect x="1" y="21" width="58" height="11" rx="3"
      fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- 中央の縦線 -->
    <line x1="30" y1="21" x2="30" y2="58"
      stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <!-- フタの横線 -->
    <line x1="1" y1="26.5" x2="59" y2="26.5"
      stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <!-- リボン左ループ -->
    <path d="M30 21 C25 13 12 11 14 17.5 C15.5 22 26 21 30 21"
      fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- リボン右ループ -->
    <path d="M30 21 C35 13 48 11 46 17.5 C44.5 22 34 21 30 21"
      fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- ワードマーク "Giftalk" -->
  <text x="76" y="55"
    font-family="'Inter','DM Sans','Nunito','Helvetica Neue',Arial,sans-serif"
    font-size="46"
    font-weight="800"
    fill="currentColor"
    letter-spacing="-0.8">Giftalk</text>
</svg>
