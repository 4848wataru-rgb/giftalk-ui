<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アバター作成 - OKURIATO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #FFF0F8 0%, #F3E8FF 100%); min-height: 100vh; }

    .page-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 100px;
    }

    /* Steps */
    .steps-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 32px;
    }
    .s-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .s-num {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #aaa;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    .s-item.active .s-num { background: var(--gradient); color: white; box-shadow: 0 4px 12px rgba(255,107,157,0.4); }
    .s-item.done .s-num { background: #4CAF50; color: white; }
    .s-label { font-size: 0.7rem; color: #aaa; font-weight: 700; white-space: nowrap; }
    .s-item.active .s-label { color: var(--primary); }
    .s-line { width: 40px; height: 2px; background: #e0e0e0; margin-bottom: 20px; flex-shrink: 0; }

    /* Layout */
    .avatar-layout {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 767px) {
      .avatar-layout { grid-template-columns: 1fr; }
      .page-wrapper { padding: 16px 14px 100px; }

      /* Preview card — sticky解除してトップに表示 */
      .preview-card { position: static; margin-bottom: 16px; order: -1; }
      .avatar-stage { width: 150px; height: 180px; margin: 0 auto; }
      .avatar-stage canvas { width: 150px !important; height: 180px !important; }

      /* Customize card */
      .customize-card { padding: 18px 14px; }

      /* Option rows — horizontal scroll */
      .opt-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
      .opt-row::-webkit-scrollbar { display: none; }
      .opt-btn { flex-shrink: 0; }

      /* Expression / motion rows */
      .expr-grid, .motion-grid { grid-template-columns: repeat(4,1fr); gap: 6px; }
      .expr-btn, .motion-btn { padding: 8px 4px; font-size: 0.68rem; }
    }

    /* Preview Card */
    .preview-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      text-align: center;
      position: sticky;
      top: 80px;
    }
    .preview-title {
      font-size: 0.8rem;
      color: var(--text-light);
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .avatar-stage {
      width: 200px;
      height: 240px;
      margin: 0 auto 16px;
      position: relative;
    }
    #avatarCanvas {
      width: 200px;
      height: 240px;
    }
    .motion-label {
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 8px;
    }
    .expr-display {
      font-size: 1.5rem;
      margin-top: 4px;
    }

    /* Past Avatars */
    .past-section {
      margin-bottom: 20px;
    }
    .past-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .past-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .past-avatar-item {
      width: 58px; height: 70px;
      border-radius: 14px;
      border: 2px solid #eee;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      transition: all 0.2s;
      background: linear-gradient(135deg,#FFF5FB,#F3EEFF);
      overflow: hidden;
      padding: 0;
    }
    .past-avatar-item:hover, .past-avatar-item.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,107,157,0.18);
    }
    .past-avatar-item.new-btn {
      background: var(--bg);
      font-size: 1.2rem;
      color: var(--primary);
      border-style: dashed;
      border-color: var(--primary);
    }

    /* Customization Panels */
    .custom-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }
    .custom-section {
      margin-bottom: 28px;
    }
    .custom-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .option-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .opt-btn {
      padding: 7px 14px;
      border-radius: 50px;
      border: 2px solid #eee;
      background: white;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      transition: all 0.2s;
      font-family: inherit;
    }
    .opt-btn:hover { border-color: var(--primary); color: var(--primary); }
    .opt-btn.active { border-color: var(--primary); color: var(--primary); background: #fff0f7; }

    /* Color swatches */
    .color-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.active { border-color: var(--primary); transform: scale(1.15); }

    /* Expression grid */
    .expr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .expr-btn {
      padding: 10px 6px;
      border-radius: 14px;
      border: 2px solid #eee;
      background: white;
      cursor: pointer;
      font-size: 1.4rem;
      transition: all 0.2s;
      text-align: center;
    }
    .expr-btn span { display: block; font-size: 0.65rem; color: var(--text-light); font-weight: 700; margin-top: 3px; font-family: inherit; }
    .expr-btn:hover { transform: scale(1.05); border-color: var(--primary); }
    .expr-btn.active { border-color: var(--primary); background: #fff0f7; box-shadow: 0 4px 12px rgba(255,107,157,0.2); }

    /* Motion grid */
    .motion-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .motion-btn {
      padding: 12px 8px;
      border-radius: 14px;
      border: 2px solid #eee;
      background: white;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
    }
    .motion-btn span { display: block; font-size: 0.65rem; color: var(--text-light); font-weight: 700; margin-top: 3px; }
    .motion-btn:hover { border-color: var(--secondary); }
    .motion-btn.active { border-color: var(--secondary); background: #f5ecff; box-shadow: 0 4px 12px rgba(168,85,247,0.2); }

    /* Name input */
    .name-input {
      width: 100%;
      padding: 11px 16px;
      border: 2px solid #eee;
      border-radius: 50px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .name-input:focus { border-color: var(--primary); }

    /* Bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.09);
      padding: 14px 24px;
      z-index: 200;
    }
    .bottom-bar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }
  </style>
</head>

<script>
// ===== Avatar State =====
const avatarState = {
  faceColor: '#FFDABB',
  hairStyle: 'short',
  hairColor: '#3D2B1F',
  eyeStyle: 'normal',
  accessory: 'none',
  outfit: 'casual',
  expression: 'happy',
  motion: 'bounce'
};

const EXPR_EMOJI = {
  happy: '😄', love: '🥰', thanks: '🙏', cool: '😎',
  excited: '🤩', shy: '😊', celebrate: '🎉', cheer: '💪'
};
const MOTION_LABEL = {
  bounce: 'ジャンプ中', wave: '手を振ってる', spin: 'くるくる', heartbeat: 'ドキドキ', tada: 'やったー！', none: 'おすまし'
};

// ===== Option Setters =====
function setOption(key, val, el) {
  avatarState[key] = val;
  const parentId = { faceColor: 'faceColorRow', hairStyle: 'hairStyleRow', hairColor: 'hairColorRow', eyeStyle: 'eyeStyleRow', accessory: 'accessoryRow', outfit: 'outfitRow' }[key];
  if (parentId) {
    document.querySelectorAll(`#${parentId} .opt-btn, #${parentId} .color-swatch`).forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }
  updatePreview();
}

function setExpr(val, el) {
  avatarState.expression = val;
  document.querySelectorAll('.expr-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('exprDisplay').textContent = EXPR_EMOJI[val];
  updatePreview();
}

function setMotion(val, el) {
  avatarState.motion = val;
  document.querySelectorAll('.motion-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('motionLabel').textContent = MOTION_LABEL[val];
  applyMotion();
}

// ===== Canvas Drawing =====
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
let animFrame = null;
let animAngle = 0;

// Canvas size
const CW = 200, CH = 240;
// Center and key anchors
const CX = 100; // center X
// Key Y positions
const HEAD_CY = 88;  // head center Y
const HEAD_R  = 44;  // head radius
const NECK_T  = HEAD_CY + HEAD_R - 10; // top of neck
const BODY_T  = NECK_T + 14;           // top of body
const BODY_CY = BODY_T + 32;          // body ellipse center

function drawAvatar(yOffset = 0, scale = 1, rotation = 0, scaleExtra = 1) {
  const s = avatarState;
  ctx.clearRect(0, 0, CW, CH);

  ctx.save();
  ctx.translate(CX, CH / 2 + yOffset);
  ctx.rotate(rotation);
  ctx.scale(scale * scaleExtra, scale * scaleExtra);
  ctx.translate(-CX, -CH / 2);

  const fc = s.faceColor;
  const hc = s.hairColor;

  // --- Shadow under body ---
  const shadowGrd = ctx.createRadialGradient(CX, CH - 18, 4, CX, CH - 18, 38);
  shadowGrd.addColorStop(0, 'rgba(0,0,0,0.13)');
  shadowGrd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.ellipse(CX, CH - 18, 38, 12, 0, 0, Math.PI*2);
  ctx.fillStyle = shadowGrd; ctx.fill();

  // --- Body ---
  drawBody(s.outfit, fc);

  // --- Neck ---
  drawNeck(fc);

  // --- Head (back hair layer) ---
  drawHairBack(s.hairStyle, hc);

  // --- Head shape ---
  drawHead(fc);

  // --- Ears ---
  drawEars(fc);

  // --- Ear accessories (earring) ---
  if (s.accessory === 'earring') drawEarrings();

  // --- Front hair ---
  drawHairFront(s.hairStyle, hc);

  // --- Eyebrows ---
  drawEyebrows(s.expression);

  // --- Eyes ---
  drawEyes(s.eyeStyle, s.expression);

  // --- Nose ---
  drawNose(fc);

  // --- Mouth ---
  drawMouth(s.expression);

  // --- Cheeks ---
  if (['love','shy','happy','celebrate','cheer'].includes(s.expression)) {
    ctx.beginPath(); ctx.ellipse(CX-28, HEAD_CY+18, 10, 6, -0.15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,130,130,0.28)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(CX+28, HEAD_CY+18, 10, 6, 0.15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,130,130,0.28)'; ctx.fill();
  }

  // --- Non-earring accessories ---
  if (s.accessory !== 'earring') drawAccessory(s.accessory);

  // --- Sparkle effect ---
  if (['excited','celebrate'].includes(s.expression)) drawSparkles();

  ctx.restore();
}

// ---- Body ----
function drawBody(outfit, fc) {
  const configs = {
    casual: { top:'#5BA4CF', bot:'#3A7FBF', col:'#5BA4CF' },
    formal: { top:'#3A4A6B', bot:'#2A3555', col:'#3A4A6B' },
    dress:  { top:'#FF7BAC', bot:'#E0508A', col:'#FF7BAC' },
    yukata: { top:'#5C8A6E', bot:'#3D6B50', col:'#5C8A6E' },
  };
  const cfg = configs[outfit] || configs.casual;

  // Torso gradient
  const bodyGrd = ctx.createLinearGradient(CX-40, BODY_T, CX+40, BODY_T+70);
  bodyGrd.addColorStop(0, cfg.top);
  bodyGrd.addColorStop(1, cfg.bot);

  // Main torso path
  ctx.beginPath();
  ctx.moveTo(CX-36, BODY_T + 4);
  ctx.quadraticCurveTo(CX-42, BODY_T, CX-30, BODY_T);
  ctx.lineTo(CX+30, BODY_T);
  ctx.quadraticCurveTo(CX+42, BODY_T, CX+36, BODY_T+4);
  ctx.lineTo(CX+38, BODY_T+55);
  ctx.quadraticCurveTo(CX+36, BODY_T+72, CX+20, BODY_T+74);
  ctx.lineTo(CX-20, BODY_T+74);
  ctx.quadraticCurveTo(CX-36, BODY_T+72, CX-38, BODY_T+55);
  ctx.closePath();
  ctx.fillStyle = bodyGrd;
  ctx.fill();

  // Outfit details
  if (outfit === 'casual') {
    // Ribbed crew neck
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(CX-20, BODY_T);
    ctx.bezierCurveTo(CX-12, BODY_T+16, CX+12, BODY_T+16, CX+20, BODY_T);
    ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.stroke();
    ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.stroke();
    ctx.restore();
    // Rib texture lines on collar
    for(let i=0;i<4;i++) {
      const t = 0.25+i*0.18;
      const nx = CX + Math.cos(Math.PI*t)*(HEAD_R-2);
      ctx.beginPath(); ctx.moveTo(nx, BODY_T+1); ctx.lineTo(nx, BODY_T+4);
      ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1.2; ctx.stroke();
    }
    // Chest seam / center line
    ctx.beginPath(); ctx.moveTo(CX, BODY_T+18); ctx.lineTo(CX, BODY_T+72);
    ctx.strokeStyle='rgba(0,0,0,0.07)'; ctx.lineWidth=1; ctx.stroke();
    // Pocket with stitching
    ctx.beginPath(); ctx.roundRect(CX+8, BODY_T+36, 18, 14, 3);
    ctx.fillStyle='rgba(0,0,0,0.06)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.4; ctx.stroke();
    // Pocket stitch dots
    ctx.fillStyle='rgba(255,255,255,0.2)';
    [0,5,10,15].forEach(dx => { ctx.beginPath(); ctx.arc(CX+9+dx, BODY_T+35, 0.8, 0, Math.PI*2); ctx.fill(); });

  } else if (outfit === 'formal') {
    // Shirt placket with subtle gradient
    const placketG = ctx.createLinearGradient(CX-10,BODY_T, CX+10,BODY_T+72);
    placketG.addColorStop(0,'rgba(255,255,255,0.92)'); placketG.addColorStop(1,'rgba(240,240,248,0.88)');
    ctx.beginPath();
    ctx.moveTo(CX-11, BODY_T+2); ctx.lineTo(CX-9, BODY_T+72);
    ctx.lineTo(CX+9, BODY_T+72); ctx.lineTo(CX+11, BODY_T+2);
    ctx.closePath(); ctx.fillStyle=placketG; ctx.fill();
    // Placket edge shadow
    ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX-10,BODY_T+3); ctx.lineTo(CX-8,BODY_T+72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX+10,BODY_T+3); ctx.lineTo(CX+8,BODY_T+72); ctx.stroke();
    // Shirt collar points
    ctx.beginPath();
    ctx.moveTo(CX-14,BODY_T); ctx.lineTo(CX-8,BODY_T+10); ctx.lineTo(CX,BODY_T+6);
    ctx.lineTo(CX+8,BODY_T+10); ctx.lineTo(CX+14,BODY_T);
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
    ctx.strokeStyle='rgba(200,200,220,0.5)'; ctx.lineWidth=0.8; ctx.stroke();
    // Collar shadow
    ctx.beginPath();
    ctx.moveTo(CX-6,BODY_T+8); ctx.lineTo(CX,BODY_T+6); ctx.lineTo(CX+6,BODY_T+8);
    ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=1; ctx.stroke();
    // Buttons with detail
    [14,26,38,50].forEach(dy => {
      const bG = ctx.createRadialGradient(CX-0.5,BODY_T+dy-0.5,0.5,CX,BODY_T+dy,3);
      bG.addColorStop(0,'#eee'); bG.addColorStop(1,'#aaa');
      ctx.beginPath(); ctx.arc(CX, BODY_T+dy, 2.8, 0, Math.PI*2);
      ctx.fillStyle=bG; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=0.7; ctx.stroke();
      // Button holes
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.moveTo(CX-1.2,BODY_T+dy); ctx.lineTo(CX+1.2,BODY_T+dy); ctx.stroke();
    });
    // Tie with knot detail
    const tieG = ctx.createLinearGradient(CX-6,BODY_T,CX+6,BODY_T+38);
    tieG.addColorStop(0,'#E74C3C'); tieG.addColorStop(0.4,'#C0392B'); tieG.addColorStop(1,'#922B21');
    ctx.beginPath();
    ctx.moveTo(CX-5,BODY_T+2); ctx.lineTo(CX+5,BODY_T+2);
    ctx.lineTo(CX+7,BODY_T+20); ctx.lineTo(CX+4,BODY_T+24);
    ctx.lineTo(CX,BODY_T+40); ctx.lineTo(CX-4,BODY_T+24);
    ctx.lineTo(CX-7,BODY_T+20); ctx.closePath();
    ctx.fillStyle=tieG; ctx.fill();
    // Tie knot sheen
    ctx.beginPath(); ctx.moveTo(CX-5,BODY_T+2); ctx.lineTo(CX+5,BODY_T+2);
    ctx.lineTo(CX+6,BODY_T+12); ctx.lineTo(CX,BODY_T+16); ctx.lineTo(CX-6,BODY_T+12);
    ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.fill();
    // Tie stripe
    ctx.beginPath(); ctx.moveTo(CX-4,BODY_T+18); ctx.lineTo(CX+4,BODY_T+18);
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX-5,BODY_T+24); ctx.lineTo(CX+5,BODY_T+24);
    ctx.stroke();

  } else if (outfit === 'dress') {
    // Sweetheart / off-shoulder neckline
    ctx.beginPath();
    ctx.moveTo(CX-26, BODY_T+2);
    ctx.bezierCurveTo(CX-22, BODY_T+10, CX-8, BODY_T+14, CX, BODY_T+12);
    ctx.bezierCurveTo(CX+8, BODY_T+14, CX+22, BODY_T+10, CX+26, BODY_T+2);
    ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2.5; ctx.stroke();
    // Bodice seam
    ctx.beginPath();
    ctx.moveTo(CX-20, BODY_T+4); ctx.bezierCurveTo(CX-10,BODY_T+30, CX+10,BODY_T+30, CX+20,BODY_T+4);
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.stroke();
    // Waist ribbon
    const ribbonG = ctx.createLinearGradient(CX-38,BODY_T+42,CX+38,BODY_T+48);
    ribbonG.addColorStop(0,'rgba(255,255,255,0.08)'); ribbonG.addColorStop(0.5,'rgba(255,255,255,0.28)'); ribbonG.addColorStop(1,'rgba(255,255,255,0.08)');
    ctx.beginPath(); ctx.ellipse(CX, BODY_T+45, 36, 5, 0, 0, Math.PI*2);
    ctx.fillStyle=ribbonG; ctx.fill();
    // Skirt layers
    [[BODY_T+50, 36, 10],[BODY_T+60, 40, 14]].forEach(([y,rx,ry]) => {
      ctx.beginPath(); ctx.ellipse(CX, y, rx, ry, 0, 0, Math.PI);
      ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1; ctx.stroke();
    });
    // Bow at ribbon center
    const bwG = ctx.createRadialGradient(CX-2,BODY_T+43,1,CX,BODY_T+45,8);
    bwG.addColorStop(0,'rgba(255,255,255,0.7)'); bwG.addColorStop(1,'rgba(255,255,255,0.3)');
    ctx.beginPath(); ctx.ellipse(CX-6,BODY_T+45, 7,4,-0.35,0,Math.PI*2); ctx.fillStyle=bwG; ctx.fill();
    ctx.beginPath(); ctx.ellipse(CX+6,BODY_T+45, 7,4, 0.35,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(CX,BODY_T+45, 4,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
    // Lace hem suggestion
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1.2; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.ellipse(CX, BODY_T+72, 36, 4, 0, 0, Math.PI); ctx.stroke();
    ctx.setLineDash([]);

  } else if (outfit === 'yukata') {
    // Fabric texture — diagonal lines
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(CX-38, BODY_T); ctx.lineTo(CX+38, BODY_T);
    ctx.lineTo(CX+38, BODY_T+74); ctx.lineTo(CX-38, BODY_T+74); ctx.closePath();
    ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1.5;
    for(let i=-6;i<14;i++) {
      ctx.beginPath(); ctx.moveTo(CX-38+i*10, BODY_T); ctx.lineTo(CX-38+i*10+30, BODY_T+74); ctx.stroke();
    }
    ctx.restore();
    // Collar layering — left over right (Japanese style)
    const colG = ctx.createLinearGradient(CX-18,BODY_T,CX+18,BODY_T+24);
    colG.addColorStop(0,'rgba(255,255,255,0.85)'); colG.addColorStop(1,'rgba(240,240,240,0.7)');
    ctx.beginPath();
    ctx.moveTo(CX+14, BODY_T); ctx.lineTo(CX-4, BODY_T+22); ctx.lineTo(CX-4, BODY_T+74);
    ctx.lineTo(CX+2, BODY_T+74); ctx.lineTo(CX+2, BODY_T+26); ctx.lineTo(CX+18, BODY_T);
    ctx.closePath(); ctx.fillStyle=colG; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(CX-14, BODY_T); ctx.lineTo(CX+2, BODY_T+20); ctx.lineTo(CX+2, BODY_T+74);
    ctx.lineTo(CX-2, BODY_T+74); ctx.lineTo(CX-2, BODY_T+24); ctx.lineTo(CX-18, BODY_T);
    ctx.closePath(); ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();
    // Collar shadow
    ctx.beginPath(); ctx.moveTo(CX-14,BODY_T); ctx.lineTo(CX,BODY_T+22); ctx.lineTo(CX+14,BODY_T);
    ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=1.5; ctx.stroke();
    // Obi sash
    const obiG = ctx.createLinearGradient(CX-38,BODY_T+38, CX+38,BODY_T+56);
    obiG.addColorStop(0,'#C8920A'); obiG.addColorStop(0.3,'#F0C030'); obiG.addColorStop(0.6,'#D4A820'); obiG.addColorStop(1,'#A07010');
    ctx.beginPath();
    ctx.moveTo(CX-38,BODY_T+38); ctx.lineTo(CX+38,BODY_T+38);
    ctx.lineTo(CX+36,BODY_T+56); ctx.lineTo(CX-36,BODY_T+56); ctx.closePath();
    ctx.fillStyle=obiG; ctx.fill();
    // Obi top/bottom edge
    ctx.strokeStyle='rgba(180,130,0,0.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX-38,BODY_T+38); ctx.lineTo(CX+38,BODY_T+38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX-36,BODY_T+56); ctx.lineTo(CX+36,BODY_T+56); ctx.stroke();
    // Obi texture horizontal lines
    ctx.strokeStyle='rgba(255,200,50,0.2)'; ctx.lineWidth=1;
    [42,46,50].forEach(dy => {
      ctx.beginPath(); ctx.moveTo(CX-37,BODY_T+dy); ctx.lineTo(CX+37,BODY_T+dy); ctx.stroke();
    });
    // Obi-dome (decorative knot suggestion)
    const domeG = ctx.createRadialGradient(CX-2,BODY_T+46,2,CX,BODY_T+47,12);
    domeG.addColorStop(0,'#FFF0A0'); domeG.addColorStop(0.5,'#F0C030'); domeG.addColorStop(1,'#A07010');
    ctx.beginPath(); ctx.ellipse(CX, BODY_T+47, 13, 8, 0, 0, Math.PI*2);
    ctx.fillStyle=domeG; ctx.fill();
    ctx.strokeStyle='rgba(140,90,0,0.4)'; ctx.lineWidth=1; ctx.stroke();
    // Floral motif on yukata body
    const motifPos = [[CX-22,BODY_T+20],[CX+22,BODY_T+18],[CX-16,BODY_T+64],[CX+18,BODY_T+62]];
    motifPos.forEach(([mx,my]) => {
      ctx.fillStyle='rgba(255,255,255,0.1)';
      for(let i=0;i<5;i++) {
        const a=i*Math.PI*2/5;
        ctx.beginPath(); ctx.ellipse(mx+Math.cos(a)*5,my+Math.sin(a)*5,3,2,a,0,Math.PI*2); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(mx,my,2.5,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fill();
    });
  }

  // Arms
  drawArms(outfit, cfg.col, fc);
}

function drawArms(outfit, bodyCol, fc) {
  // Left arm
  const armGrd = ctx.createLinearGradient(CX-55, BODY_T+10, CX-45, BODY_T+60);
  armGrd.addColorStop(0, bodyCol); armGrd.addColorStop(1, darken(bodyCol, 0.15));
  ctx.beginPath();
  ctx.moveTo(CX-32, BODY_T+4);
  ctx.bezierCurveTo(CX-48, BODY_T+6, CX-56, BODY_T+30, CX-52, BODY_T+54);
  ctx.bezierCurveTo(CX-50, BODY_T+62, CX-40, BODY_T+62, CX-38, BODY_T+54);
  ctx.bezierCurveTo(CX-36, BODY_T+36, CX-32, BODY_T+16, CX-26, BODY_T+8);
  ctx.fillStyle = armGrd; ctx.fill();
  // Left hand
  ctx.beginPath(); ctx.ellipse(CX-45, BODY_T+58, 8, 7, 0.3, 0, Math.PI*2);
  ctx.fillStyle = fc; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.07)'; ctx.lineWidth=1; ctx.stroke();

  // Right arm
  const armGrd2 = ctx.createLinearGradient(CX+55, BODY_T+10, CX+45, BODY_T+60);
  armGrd2.addColorStop(0, bodyCol); armGrd2.addColorStop(1, darken(bodyCol, 0.15));
  ctx.beginPath();
  ctx.moveTo(CX+32, BODY_T+4);
  ctx.bezierCurveTo(CX+48, BODY_T+6, CX+56, BODY_T+30, CX+52, BODY_T+54);
  ctx.bezierCurveTo(CX+50, BODY_T+62, CX+40, BODY_T+62, CX+38, BODY_T+54);
  ctx.bezierCurveTo(CX+36, BODY_T+36, CX+32, BODY_T+16, CX+26, BODY_T+8);
  ctx.fillStyle = armGrd2; ctx.fill();
  // Right hand
  ctx.beginPath(); ctx.ellipse(CX+45, BODY_T+58, 8, 7, -0.3, 0, Math.PI*2);
  ctx.fillStyle = fc; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.07)'; ctx.lineWidth=1; ctx.stroke();
}

function darken(hex, amount) {
  let c = parseInt(hex.replace('#',''), 16);
  let r = Math.max(0, ((c>>16)&0xff) - Math.round(255*amount));
  let g = Math.max(0, ((c>>8)&0xff) - Math.round(255*amount));
  let b = Math.max(0, (c&0xff) - Math.round(255*amount));
  return `rgb(${r},${g},${b})`;
}

// ---- Neck ----
function drawNeck(fc) {
  const grd = ctx.createLinearGradient(CX-10, NECK_T, CX+10, NECK_T+16);
  grd.addColorStop(0, fc); grd.addColorStop(1, darken(fc, 0.08));
  ctx.beginPath();
  ctx.moveTo(CX-9, NECK_T);
  ctx.bezierCurveTo(CX-10, NECK_T+8, CX-8, NECK_T+16, CX-7, NECK_T+18);
  ctx.lineTo(CX+7, NECK_T+18);
  ctx.bezierCurveTo(CX+8, NECK_T+16, CX+10, NECK_T+8, CX+9, NECK_T);
  ctx.closePath();
  ctx.fillStyle = grd; ctx.fill();
}

// ---- Head ---- (anime style: wide top, tapered chin)
function drawHead(fc) {
  const HY = HEAD_CY, HR = HEAD_R;
  ctx.beginPath();
  // Wide forehead, narrow chin — anime silhouette
  ctx.moveTo(CX, HY - HR - 2);
  ctx.bezierCurveTo(CX + HR + 6, HY - HR + 4, CX + HR + 8, HY + 4, CX + HR, HY + 10);
  ctx.bezierCurveTo(CX + HR - 4, HY + HR * 0.7, CX + 10, HY + HR + 4, CX, HY + HR + 6);
  ctx.bezierCurveTo(CX - 10, HY + HR + 4, CX - HR + 4, HY + HR * 0.7, CX - HR, HY + 10);
  ctx.bezierCurveTo(CX - HR - 8, HY + 4, CX - HR - 6, HY - HR + 4, CX, HY - HR - 2);
  ctx.closePath();
  ctx.fillStyle = fc;
  ctx.fill();
  // Very soft cheek blush hint (anime style)
  const blushG = ctx.createRadialGradient(CX - HR*0.5, HY + 10, 0, CX - HR*0.5, HY + 10, HR*0.4);
  blushG.addColorStop(0, 'rgba(255,180,180,0.13)');
  blushG.addColorStop(1, 'rgba(255,180,180,0)');
  ctx.beginPath(); ctx.ellipse(CX - HR*0.5, HY + 10, HR*0.4, HR*0.28, 0, 0, Math.PI*2);
  ctx.fillStyle = blushG; ctx.fill();
  const blushGR = ctx.createRadialGradient(CX + HR*0.5, HY + 10, 0, CX + HR*0.5, HY + 10, HR*0.4);
  blushGR.addColorStop(0, 'rgba(255,180,180,0.13)');
  blushGR.addColorStop(1, 'rgba(255,180,180,0)');
  ctx.beginPath(); ctx.ellipse(CX + HR*0.5, HY + 10, HR*0.4, HR*0.28, 0, 0, Math.PI*2);
  ctx.fillStyle = blushGR; ctx.fill();
}

function lighten(hex, amount) {
  let c = parseInt(hex.replace('#',''), 16);
  let r = Math.min(255, ((c>>16)&0xff) + Math.round(255*amount));
  let g = Math.min(255, ((c>>8)&0xff) + Math.round(255*amount));
  let b = Math.min(255, (c&0xff) + Math.round(255*amount));
  return `rgb(${r},${g},${b})`;
}

// ---- Ears ---- (anime: simple small rounded ear, no inner detail)
function drawEars(fc) {
  // Left ear
  ctx.beginPath();
  ctx.ellipse(CX - HEAD_R + 1, HEAD_CY + 6, 7, 10, -0.1, 0, Math.PI*2);
  ctx.fillStyle = fc; ctx.fill();
  // Right ear
  ctx.beginPath();
  ctx.ellipse(CX + HEAD_R - 1, HEAD_CY + 6, 7, 10, 0.1, 0, Math.PI*2);
  ctx.fillStyle = fc; ctx.fill();
}

// ---- Hair ----
function hairGrd(hc, x1,y1,x2,y2) {
  const g = ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0, lighten(hc,0.14));
  g.addColorStop(0.45, hc);
  g.addColorStop(1, darken(hc,0.18));
  return g;
}

function drawHairBack(style, hc) {
  const HY = HEAD_CY, HR = HEAD_R;
  if (style === 'short') {
    // Rounded cap + slight side taper
    const g = hairGrd(hc, CX-HR, HY-HR, CX+HR, HY+4);
    ctx.beginPath();
    ctx.moveTo(CX-HR-2, HY+6);
    ctx.bezierCurveTo(CX-HR-4, HY-6, CX-HR+2, HY-HR-8, CX, HY-HR-6);
    ctx.bezierCurveTo(CX+HR-2, HY-HR-8, CX+HR+4, HY-6, CX+HR+2, HY+6);
    ctx.bezierCurveTo(CX+HR, HY+14, CX-HR, HY+14, CX-HR-2, HY+6);
    ctx.fillStyle = g; ctx.fill();

  } else if (style === 'long') {
    // Smooth flowing back panels with layered depth
    const g = hairGrd(hc, CX-HR-12, HY, CX-HR+4, BODY_T+60);
    // Left panel
    ctx.beginPath();
    ctx.moveTo(CX-HR+6, HY+16);
    ctx.bezierCurveTo(CX-HR-8, HY+32, CX-HR-18, BODY_T+30, CX-HR-8, BODY_T+62);
    ctx.bezierCurveTo(CX-HR, BODY_T+70, CX-14, BODY_T+68, CX-8, BODY_T+64);
    ctx.bezierCurveTo(CX-6, HY+52, CX-HR+4, HY+28, CX-HR+6, HY+16);
    ctx.fillStyle = g; ctx.fill();
    // Left shadow edge
    ctx.beginPath();
    ctx.moveTo(CX-HR+6, HY+16);
    ctx.bezierCurveTo(CX-HR-8, HY+32, CX-HR-18, BODY_T+30, CX-HR-8, BODY_T+62);
    ctx.strokeStyle = darken(hc,0.14); ctx.lineWidth=1.2; ctx.stroke();
    // Right panel
    const g2 = hairGrd(hc, CX+HR+12, HY, CX+HR-4, BODY_T+60);
    ctx.beginPath();
    ctx.moveTo(CX+HR-6, HY+16);
    ctx.bezierCurveTo(CX+HR+8, HY+32, CX+HR+18, BODY_T+30, CX+HR+8, BODY_T+62);
    ctx.bezierCurveTo(CX+HR, BODY_T+70, CX+14, BODY_T+68, CX+8, BODY_T+64);
    ctx.bezierCurveTo(CX+6, HY+52, CX+HR-4, HY+28, CX+HR-6, HY+16);
    ctx.fillStyle = g2; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(CX+HR-6, HY+16);
    ctx.bezierCurveTo(CX+HR+8, HY+32, CX+HR+18, BODY_T+30, CX+HR+8, BODY_T+62);
    ctx.strokeStyle = darken(hc,0.14); ctx.lineWidth=1.2; ctx.stroke();

  } else if (style === 'wavy') {
    const g = hairGrd(hc, CX-HR-12, HY, CX+HR+12, BODY_T+50);
    ctx.beginPath();
    ctx.moveTo(CX-HR+2, HY+14);
    ctx.bezierCurveTo(CX-HR-14, HY+34, CX-HR-12, BODY_T+34, CX-HR, BODY_T+54);
    ctx.bezierCurveTo(CX-HR+18, BODY_T+62, CX-4, BODY_T+60, CX, BODY_T+57);
    ctx.bezierCurveTo(CX+4, BODY_T+60, CX+HR-18, BODY_T+62, CX+HR, BODY_T+54);
    ctx.bezierCurveTo(CX+HR+12, BODY_T+34, CX+HR+14, HY+34, CX+HR-2, HY+14);
    ctx.arc(CX, HY-2, HR+2, 0.22, Math.PI-0.22, true);
    ctx.fillStyle = g; ctx.fill();
    // Wavy edge suggestion
    ctx.strokeStyle = darken(hc,0.1); ctx.lineWidth=1;
    [-HR-2, HR+2].forEach(sx => {
      ctx.beginPath();
      for(let i=0;i<4;i++) {
        const ty = HY+20 + i*24;
        ctx.arc(CX+sx+(sx>0?-10:10), ty, 8, sx>0?0:Math.PI, sx>0?Math.PI:0, sx>0);
      }
      ctx.stroke();
    });

  } else if (style === 'bun') {
    const g = hairGrd(hc, CX-HR, HY-4, CX+HR, HY+12);
    ctx.beginPath();
    ctx.arc(CX, HY-2, HR+2, Math.PI*0.88, Math.PI*0.12, false);
    ctx.arc(CX, HY, HR+1, 0.14, Math.PI-0.14, false);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();

  } else if (style === 'hat') {
    const g = hairGrd(hc, CX-HR, HY, CX+HR, HY+8);
    ctx.beginPath(); ctx.arc(CX, HY, HR+1, 0.28, Math.PI-0.28, false);
    ctx.arc(CX, HY+4, HR+1, Math.PI-0.28, 0.28, true);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  }
}

function drawHairFront(style, hc) {
  const HY = HEAD_CY, HR = HEAD_R;
  const hcL = lighten(hc, 0.22);
  const hcD = darken(hc, 0.07);

  if (style === 'short') {
    // Smooth cap
    const g = hairGrd(hc, CX-HR, HY-HR-4, CX+HR, HY+4);
    ctx.beginPath();
    ctx.arc(CX, HY-8, HR+1, Math.PI*1.04, -0.06);
    ctx.quadraticCurveTo(CX+HR+3, HY-4, CX+HR-1, HY+10);
    ctx.arc(CX, HY, HR+0.5, 0.22, Math.PI-0.22, true);
    ctx.quadraticCurveTo(CX-HR-3, HY-4, CX-HR-1, HY-8);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    // Individual fringe strands — tapered tips
    const strands = [[-20,-1,4,11,-0.06],[-12,-4,5,12,-0.04],[-3,-6,5,12,0],
                     [6,-5,5,11,0.04],[15,-2,4,10,0.06]];
    strands.forEach(([dx,dy,rw,rh,rot]) => {
      ctx.save();
      ctx.translate(CX+dx, HY-HR+5+dy);
      ctx.rotate(rot);
      // Main strand body
      ctx.beginPath();
      ctx.moveTo(-rw, 0); ctx.bezierCurveTo(-rw, rh*0.5, -rw*0.4, rh, 0, rh+2);
      ctx.bezierCurveTo(rw*0.4, rh, rw, rh*0.5, rw, 0);
      ctx.bezierCurveTo(rw, -rh*0.3, -rw, -rh*0.3, -rw, 0);
      ctx.fillStyle = hcD; ctx.fill();
      // Strand highlight
      ctx.beginPath(); ctx.ellipse(-rw*0.2, rh*0.2, rw*0.3, rh*0.35, 0, 0, Math.PI*2);
      ctx.fillStyle = lighten(hc,0.1); ctx.fill();
      ctx.restore();
    });
    // Scalp highlight streak
    const hlG = ctx.createLinearGradient(CX-8, HY-HR, CX-2, HY-HR+16);
    hlG.addColorStop(0, 'rgba(255,255,255,0.28)'); hlG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.ellipse(CX-5, HY-HR+8, 4, 13, -0.25, 0, Math.PI);
    ctx.fillStyle = hlG; ctx.fill();

  } else if (style === 'long') {
    // Crown
    const g = hairGrd(hc, CX-HR, HY-HR, CX+HR, HY);
    ctx.beginPath();
    ctx.arc(CX, HY-8, HR+1, Math.PI*1.07, -0.08);
    ctx.arc(CX, HY, HR+0.5, -0.08, Math.PI+0.08, true);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    // Fringe — longer tapered strands
    const strands = [[-22,1,5,14,-0.08],[-13,-3,5,13,-0.04],[-3,-6,5,14,0],
                     [7,-4,5,13,0.04],[17,-1,5,12,0.07]];
    strands.forEach(([dx,dy,rw,rh,rot]) => {
      ctx.save();
      ctx.translate(CX+dx, HY-HR+6+dy);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(-rw,0); ctx.bezierCurveTo(-rw,rh*0.5,-rw*0.3,rh,0,rh+3);
      ctx.bezierCurveTo(rw*0.3,rh,rw,rh*0.5,rw,0);
      ctx.bezierCurveTo(rw,-rh*0.3,-rw,-rh*0.3,-rw,0);
      ctx.fillStyle = hcD; ctx.fill();
      ctx.restore();
    });
    // Highlight
    const hlG = ctx.createLinearGradient(CX-10, HY-HR, CX-3, HY-HR+20);
    hlG.addColorStop(0,'rgba(255,255,255,0.3)'); hlG.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.ellipse(CX-6, HY-HR+10, 4.5, 15, -0.24, 0, Math.PI);
    ctx.fillStyle = hlG; ctx.fill();

  } else if (style === 'wavy') {
    // Crown
    const g = hairGrd(hc, CX-HR, HY-HR, CX+HR, HY);
    ctx.beginPath();
    ctx.arc(CX, HY-6, HR+2, Math.PI*1.04, -0.07);
    ctx.arc(CX, HY, HR+1, -0.07, Math.PI+0.07, true);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    // Wavy fringe — undulating strands
    const wStrands = [[-22,1,0.12],[-12,-3,0.08],[-1,-5,0],[11,-3,-0.08],[21,1,-0.12]];
    wStrands.forEach(([dx,dy,wv],i) => {
      ctx.save();
      ctx.translate(CX+dx, HY-HR+6+dy);
      // S-curve wave per strand
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.bezierCurveTo(-6+wv*40, 5, -5-wv*20, 10, -4+wv*30, 14);
      ctx.bezierCurveTo(-3+wv*10, 18, 3-wv*10, 18, 4-wv*30, 14);
      ctx.bezierCurveTo(5+wv*20, 10, 6-wv*40, 5, 5, 0);
      ctx.bezierCurveTo(4,-4,-4,-4,-5,0);
      ctx.fillStyle = hcD; ctx.fill();
      ctx.restore();
    });
    // Shine
    const hlG = ctx.createLinearGradient(CX-8,HY-HR,CX-2,HY-HR+18);
    hlG.addColorStop(0,'rgba(255,255,255,0.28)'); hlG.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.ellipse(CX-5,HY-HR+9,5,14,-0.2,0,Math.PI);
    ctx.fillStyle=hlG; ctx.fill();

  } else if (style === 'bun') {
    // Front side hair
    const g = hairGrd(hc, CX-HR, HY-HR, CX+HR, HY);
    ctx.beginPath();
    ctx.arc(CX, HY-6, HR+1, Math.PI*1.08, -0.11);
    ctx.arc(CX, HY, HR, -0.11, Math.PI+0.11, true);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    // Side wisps
    [[CX-HR-4, HY+2, 7, 14, -0.2], [CX+HR+4, HY+2, 7, 14, 0.2]].forEach(([bx,by,rw,rh,rot]) => {
      ctx.save(); ctx.translate(bx, by); ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(-rw/2,0); ctx.bezierCurveTo(-rw,rh*0.4,-rw*0.6,rh,0,rh+2);
      ctx.bezierCurveTo(rw*0.6,rh,rw,rh*0.4,rw/2,0);
      ctx.bezierCurveTo(rw/2,-4,-rw/2,-4,-rw/2,0);
      ctx.fillStyle=hcD; ctx.fill(); ctx.restore();
    });
    // Bun sphere with rich gradient
    const BY = HY-HR-10;
    const bunG = ctx.createRadialGradient(CX-6, BY-6, 2, CX, BY, 19);
    bunG.addColorStop(0, lighten(hc,0.3));
    bunG.addColorStop(0.35, lighten(hc,0.12));
    bunG.addColorStop(0.7, hc);
    bunG.addColorStop(1, darken(hc,0.22));
    ctx.beginPath(); ctx.arc(CX, BY, 19, 0, Math.PI*2);
    ctx.fillStyle = bunG; ctx.fill();
    // Bun wrap lines — spiral feel
    ctx.strokeStyle = darken(hc,0.16); ctx.lineWidth=1.1; ctx.lineCap='round';
    for(let a=0; a<Math.PI*2; a+=0.42) {
      ctx.beginPath();
      ctx.arc(CX, BY, 14, a, a+0.22);
      ctx.stroke();
    }
    // Bun rim shadow
    ctx.beginPath(); ctx.arc(CX+4, BY+5, 17, 0.4, Math.PI*1.1);
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=3; ctx.stroke();
    // Highlight specular
    const hl2 = ctx.createRadialGradient(CX-7, BY-7, 1, CX-5, BY-5, 8);
    hl2.addColorStop(0,'rgba(255,255,255,0.45)'); hl2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(CX-5, BY-5, 8, 0, Math.PI*2);
    ctx.fillStyle=hl2; ctx.fill();
    // Hair tie
    const tieG = ctx.createLinearGradient(CX-18,BY+14,CX+18,BY+14);
    tieG.addColorStop(0,darken(hc,0.3)); tieG.addColorStop(0.5,darken(hc,0.08)); tieG.addColorStop(1,darken(hc,0.3));
    ctx.beginPath(); ctx.ellipse(CX, BY+16, 18, 4, 0, 0, Math.PI*2);
    ctx.fillStyle=tieG; ctx.fill();
    ctx.beginPath(); ctx.ellipse(CX, BY+16, 18, 4, 0, 0, Math.PI*2);
    ctx.strokeStyle=darken(hc,0.25); ctx.lineWidth=1; ctx.stroke();

  } else if (style === 'hat') {
    // Minimal visible fringe under hat brim
    const g = hairGrd(hc, CX-10, HY-HR+12, CX+10, HY-HR+22);
    [[-14,2,4,8,-0.04],[0,0,4,7,0],[14,2,4,8,0.04]].forEach(([dx,dy,rw,rh,rot]) => {
      ctx.save(); ctx.translate(CX+dx, HY-HR+17+dy); ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(-rw,0); ctx.bezierCurveTo(-rw,rh*0.5,-rw*0.3,rh,0,rh+1);
      ctx.bezierCurveTo(rw*0.3,rh,rw,rh*0.5,rw,0);
      ctx.bezierCurveTo(rw,-rh*0.3,-rw,-rh*0.3,-rw,0);
      ctx.fillStyle=hcD; ctx.fill(); ctx.restore();
    });
    // Hat brim (flat disc)
    const brimG = ctx.createLinearGradient(CX-HR-4, HY-HR+4, CX+HR+4, HY-HR+4);
    brimG.addColorStop(0, darken(hc,0.22));
    brimG.addColorStop(0.5, lighten(hc,0.06));
    brimG.addColorStop(1, darken(hc,0.22));
    ctx.beginPath(); ctx.ellipse(CX, HY-HR+7, HR+4, 9, 0, 0, Math.PI*2);
    ctx.fillStyle=brimG; ctx.fill();
    ctx.strokeStyle=darken(hc,0.2); ctx.lineWidth=1; ctx.stroke();
    // Hat crown
    const crownG = ctx.createLinearGradient(CX-HR+4, HY-HR-22, CX+HR-4, HY-HR+6);
    crownG.addColorStop(0, lighten(hc,0.28));
    crownG.addColorStop(0.4, lighten(hc,0.1));
    crownG.addColorStop(1, darken(hc,0.12));
    ctx.beginPath();
    ctx.moveTo(CX-HR+6, HY-HR+6);
    ctx.bezierCurveTo(CX-HR+4, HY-HR-6, CX-HR+8, HY-HR-24, CX, HY-HR-26);
    ctx.bezierCurveTo(CX+HR-8, HY-HR-24, CX+HR-4, HY-HR-6, CX+HR-6, HY-HR+6);
    ctx.closePath();
    ctx.fillStyle=crownG; ctx.fill();
    ctx.strokeStyle=darken(hc,0.2); ctx.lineWidth=1.2; ctx.stroke();
    // Hat band
    const bandG = ctx.createLinearGradient(CX-HR+6,HY-HR-4,CX+HR-6,HY-HR-4);
    bandG.addColorStop(0,'rgba(0,0,0,0.18)'); bandG.addColorStop(0.5,'rgba(0,0,0,0.08)'); bandG.addColorStop(1,'rgba(0,0,0,0.18)');
    ctx.beginPath();
    ctx.moveTo(CX-HR+6, HY-HR-1); ctx.bezierCurveTo(CX-HR+5, HY-HR-8, CX+HR-5, HY-HR-8, CX+HR-6, HY-HR-1);
    ctx.lineWidth=5; ctx.strokeStyle=bandG; ctx.stroke();
    // Hat button/badge
    const badgeG = ctx.createRadialGradient(CX-1,HY-HR-24,1,CX,HY-HR-23,5);
    badgeG.addColorStop(0,'#FF8EC4'); badgeG.addColorStop(1,'#FF3B7A');
    ctx.beginPath(); ctx.arc(CX, HY-HR-23, 5, 0, Math.PI*2);
    ctx.fillStyle=badgeG; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.stroke();
  }
}

// ---- Eyebrows ---- (anime: thin sharp arch, varied per expression)
function drawEyebrows(expr) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const eyeY = HEAD_CY - 4;
  const browY = eyeY - 15;
  const shapes = {
    happy:     [[-22,2, -15,-3, -7,1],   [7,1,  15,-3, 22,2]],
    love:      [[-22,0, -15,-5, -7,-1],  [7,-1, 15,-5, 22,0]],
    thanks:    [[-22,2, -15,-1, -7,3],   [7,3,  15,-1, 22,2]],
    cool:      [[-22,-5,-15,-5, -7,-5],  [7,-5, 15,-5, 22,-5]],
    excited:   [[-22,-4,-15,-6, -7,-2],  [7,-2, 15,-6, 22,-4]],
    shy:       [[-22,2, -15,4,  -7,6],   [7,6,  15,4,  22,2]],
    celebrate: [[-22,-3,-15,-5, -7,0],   [7,0,  15,-5, 22,-3]],
    cheer:     [[-22,-3,-15,-5, -7,-1],  [7,-1, 15,-5, 22,-3]],
  };
  const segs = shapes[expr] || shapes.happy;
  const browCol = darken(avatarState.hairColor, 0.1);
  ctx.strokeStyle = browCol;
  ctx.lineWidth = 2.2;
  segs.forEach(([x1,y1, cx,cy, x2,y2]) => {
    ctx.beginPath();
    ctx.moveTo(CX+x1, browY+y1);
    ctx.quadraticCurveTo(CX+cx, browY+cy, CX+x2, browY+y2);
    ctx.stroke();
  });
}

// ---- Eyes ---- (anime style)
// Single anime eye: large iris filling almost all sclera, bold outline, big catchlight
function drawEye(ex, eyeY, irisCol, eyeR, style) {
  // Outer eye outline shape (top arc heavier — anime eyelid)
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(ex, eyeY, eyeR, eyeR * 0.88, 0, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  // Bold upper eyelid outline
  ctx.beginPath();
  ctx.ellipse(ex, eyeY, eyeR, eyeR * 0.88, 0, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(30,15,10,0.85)';
  ctx.lineWidth = 2.2;
  ctx.stroke();
  ctx.restore();

  // Iris — large, nearly fills sclera (anime style)
  const irisR = eyeR * 0.76;
  const iG = ctx.createRadialGradient(ex - irisR*0.22, eyeY - irisR*0.28, irisR*0.05,
                                       ex, eyeY, irisR);
  iG.addColorStop(0, lighten(irisCol, 0.45));
  iG.addColorStop(0.35, lighten(irisCol, 0.18));
  iG.addColorStop(0.72, irisCol);
  iG.addColorStop(1, darken(irisCol, 0.35));
  ctx.beginPath(); ctx.arc(ex, eyeY, irisR, 0, Math.PI*2);
  ctx.fillStyle = iG; ctx.fill();

  // Pupil (large, anime)
  ctx.beginPath(); ctx.arc(ex, eyeY, irisR * 0.42, 0, Math.PI*2);
  ctx.fillStyle = '#111'; ctx.fill();

  // Big primary catchlight (upper-left)
  ctx.beginPath(); ctx.arc(ex - irisR*0.28, eyeY - irisR*0.35, irisR * 0.28, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fill();
  // Small secondary catchlight (lower-right)
  ctx.beginPath(); ctx.arc(ex + irisR*0.30, eyeY + irisR*0.22, irisR * 0.13, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.fill();

  // Bold upper lash bar (anime style: thick single line on top)
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(ex, eyeY - eyeR*0.04, eyeR + 1, eyeR * 0.88 + 0.5, 0, Math.PI + 0.12, -0.12);
  ctx.strokeStyle = 'rgba(20,8,8,0.9)';
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // Eyelash tips (3 short spikes)
  ctx.strokeStyle = 'rgba(20,8,8,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  [[-0.72, 5.2], [-0.38, 5.6], [-0.04, 5.4]].forEach(([ang, len]) => {
    const bx = ex + Math.cos(Math.PI + ang) * (eyeR + 1);
    const by = eyeY + Math.sin(Math.PI + ang) * (eyeR * 0.88 + 0.5);
    const oAng = Math.PI + ang - 0.28;
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(oAng)*len, by + Math.sin(oAng)*len);
    ctx.stroke();
  });
}

function drawEyes(style, expr) {
  const eyeY = HEAD_CY - 2;
  const lx = CX - 21, rx = CX + 21;

  if (['happy','celebrate','cheer','excited'].includes(expr)) {
    // Anime happy eyes: upward arc (^_^)
    ctx.lineCap = 'round';
    [lx, rx].forEach(ex => {
      // Filled crescent shape
      ctx.beginPath();
      ctx.arc(ex, eyeY + 5, 9, Math.PI + 0.1, -0.1);
      ctx.arc(ex, eyeY - 2, 9, -0.1, Math.PI + 0.1, true);
      ctx.closePath();
      ctx.fillStyle = '#1a1a1a'; ctx.fill();
      // Inner shine line
      ctx.beginPath(); ctx.arc(ex, eyeY + 3.5, 5.5, Math.PI + 0.3, -0.3);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.8; ctx.stroke();
    });

  } else if (expr === 'love') {
    // Heart eyes
    [lx, rx].forEach(ex => {
      ctx.save(); ctx.translate(ex, eyeY - 6);
      const hG = ctx.createRadialGradient(-3,-4,1,0,0,10);
      hG.addColorStop(0,'#FF8FB0'); hG.addColorStop(0.55,'#FF2D55'); hG.addColorStop(1,'#CC0033');
      ctx.fillStyle = hG;
      _heartPath(ctx, 0, 0, 9); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-3.5,-5.5,3,2,-0.3,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fill();
      ctx.restore();
    });

  } else if (expr === 'cool') {
    // Aviator sunglasses
    const lensData = [{x:lx-11,w:21,h:15,r:6},{x:rx-10,w:21,h:15,r:6}];
    lensData.forEach(({x,w,h,r}) => {
      const lG = ctx.createLinearGradient(x, eyeY-8, x, eyeY+8);
      lG.addColorStop(0,'rgba(20,20,40,0.92)'); lG.addColorStop(1,'rgba(10,10,25,0.85)');
      ctx.beginPath(); ctx.roundRect(x, eyeY-8, w, h, r);
      ctx.fillStyle=lG; ctx.fill();
      const glareG = ctx.createLinearGradient(x, eyeY-7, x+w*0.5, eyeY+2);
      glareG.addColorStop(0,'rgba(255,255,255,0.18)'); glareG.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath(); ctx.roundRect(x, eyeY-8, w*0.55, h*0.6, r);
      ctx.fillStyle=glareG; ctx.fill();
      ctx.beginPath(); ctx.roundRect(x, eyeY-8, w, h, r);
      const fG = ctx.createLinearGradient(x,eyeY-8,x+w,eyeY+h-8);
      fG.addColorStop(0,'#bbb'); fG.addColorStop(0.5,'#888'); fG.addColorStop(1,'#aaa');
      ctx.strokeStyle=fG; ctx.lineWidth=1.8; ctx.stroke();
    });
    const bridgeG = ctx.createLinearGradient(lx+10,eyeY-2,rx-10,eyeY-2);
    bridgeG.addColorStop(0,'#aaa'); bridgeG.addColorStop(0.5,'#777'); bridgeG.addColorStop(1,'#aaa');
    ctx.beginPath(); ctx.moveTo(lx+10,eyeY-2); ctx.lineTo(rx-10,eyeY-2);
    ctx.strokeStyle=bridgeG; ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle='#999'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(lx-11,eyeY-2); ctx.bezierCurveTo(lx-15,eyeY-2,lx-18,eyeY+1,lx-20,eyeY+3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx+11,eyeY-2); ctx.bezierCurveTo(rx+15,eyeY-2,rx+18,eyeY+1,rx+20,eyeY+3); ctx.stroke();

  } else {
    const irisColors = { normal:'#3B78E7', sparkle:'#E8309A', sleepy:'#7B7FCD', thanks:'#2e8b57', shy:'#D05090' };
    const irisCol = irisColors[style] || irisColors.normal;
    // Anime eyes: big and round. sleepy is slightly smaller
    const eyeR = style === 'sleepy' ? 7 : 9;

    [lx, rx].forEach(ex => { drawEye(ex, eyeY, irisCol, eyeR, style); });

    if (style === 'sparkle') {
      [[lx+eyeR+3, eyeY-eyeR-1, 5],[rx+eyeR+3, eyeY-eyeR-3, 4],
       [lx-eyeR-4, eyeY-4, 3],[rx+eyeR+2, eyeY+4, 3]].forEach(([sx,sy,sr]) => {
        ctx.save(); ctx.translate(sx,sy); ctx.fillStyle='#FFD700';
        ctx.beginPath();
        for(let i=0;i<5;i++){ ctx.rotate(Math.PI*2/5); ctx.lineTo(0,-sr); ctx.rotate(Math.PI/5); ctx.lineTo(0,-sr*0.4); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      });
    }
    if (style === 'sleepy') {
      // Half-closed drooping eyelid (lower half of eye covered)
      const fc = avatarState.faceColor;
      [lx, rx].forEach(ex => {
        ctx.beginPath(); ctx.ellipse(ex, eyeY - eyeR*0.1, eyeR + 0.5, eyeR * 0.52, 0, Math.PI, 0);
        ctx.fillStyle = fc; ctx.fill();
        // Sleepy eyelid outline
        ctx.beginPath(); ctx.ellipse(ex, eyeY - eyeR*0.1, eyeR + 0.5, eyeR * 0.52, 0, Math.PI, 0);
        ctx.strokeStyle = 'rgba(20,8,8,0.75)'; ctx.lineWidth = 2.8; ctx.lineCap = 'round'; ctx.stroke();
      });
    }
  }
}

function _heartPath(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y+s*0.3);
  ctx.bezierCurveTo(x, y-s*0.3, x-s, y-s*0.3, x-s, y+s*0.3);
  ctx.bezierCurveTo(x-s, y+s*0.85, x, y+s*1.2, x, y+s*1.2);
  ctx.bezierCurveTo(x, y+s*1.2, x+s, y+s*0.85, x+s, y+s*0.3);
  ctx.bezierCurveTo(x+s, y-s*0.3, x, y-s*0.3, x, y+s*0.3);
}

function drawHeart(ctx, x, y, size) {
  ctx.save();
  ctx.fillStyle = '#FF4B6E';
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.3);
  ctx.bezierCurveTo(x, y-size*0.3, x-size, y-size*0.3, x-size, y+size*0.3);
  ctx.bezierCurveTo(x-size, y+size*0.8, x, y+size*1.2, x, y+size*1.2);
  ctx.bezierCurveTo(x, y+size*1.2, x+size, y+size*0.8, x+size, y+size*0.3);
  ctx.bezierCurveTo(x+size, y-size*0.3, x, y-size*0.3, x, y+size*0.3);
  ctx.fill(); ctx.restore();
}

// ---- Nose ---- (anime: tiny subtle dot/curve, no nostrils)
function drawNose(fc) {

// ---- Mouth ----
function drawMouth(expr) {
  const my = HEAD_CY + 24;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (['happy','excited','celebrate'].includes(expr)) {
    // Big open smile
    ctx.beginPath();
    ctx.moveTo(CX-14, my);
    ctx.bezierCurveTo(CX-10, my+14, CX+10, my+14, CX+14, my);
    ctx.strokeStyle='#c0555f'; ctx.lineWidth=2.2; ctx.stroke();
    // Mouth interior
    ctx.beginPath();
    ctx.moveTo(CX-13, my+1);
    ctx.bezierCurveTo(CX-9, my+13, CX+9, my+13, CX+13, my+1);
    ctx.closePath();
    ctx.fillStyle='#6B2737'; ctx.fill();
    // Teeth
    ctx.beginPath();
    ctx.moveTo(CX-12, my+2);
    ctx.bezierCurveTo(CX-8, my+7, CX+8, my+7, CX+12, my+2);
    ctx.fillStyle='#fff'; ctx.fill();
    // Tongue
    ctx.beginPath(); ctx.ellipse(CX, my+10, 6, 4, 0, 0, Math.PI);
    ctx.fillStyle='#FF8A9A'; ctx.fill();
  } else if (expr === 'love') {
    ctx.beginPath();
    ctx.moveTo(CX-10, my+2);
    ctx.bezierCurveTo(CX-6, my+10, CX+6, my+10, CX+10, my+2);
    ctx.strokeStyle='#c0555f'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#FF8A9A';
    ctx.beginPath(); ctx.moveTo(CX-10, my+2); ctx.bezierCurveTo(CX-6, my+10, CX+6, my+10, CX+10, my+2); ctx.closePath(); ctx.fill();
  } else if (expr === 'thanks') {
    ctx.beginPath();
    ctx.moveTo(CX-11, my+4);
    ctx.bezierCurveTo(CX-4, my+10, CX+4, my+10, CX+11, my+4);
    ctx.strokeStyle='#c0555f'; ctx.lineWidth=2.2; ctx.stroke();
  } else if (expr === 'cool') {
    ctx.beginPath();
    ctx.moveTo(CX-10, my+6); ctx.lineTo(CX+10, my+6);
    ctx.strokeStyle='#555'; ctx.lineWidth=2.2; ctx.stroke();
    // Smirk
    ctx.beginPath();
    ctx.moveTo(CX+6, my+6); ctx.bezierCurveTo(CX+8, my+6, CX+10, my+4, CX+10, my+2);
    ctx.stroke();
  } else if (expr === 'shy') {
    ctx.beginPath();
    ctx.moveTo(CX-8, my+4);
    ctx.bezierCurveTo(CX-3, my+9, CX+3, my+9, CX+8, my+4);
    ctx.strokeStyle='#c0555f'; ctx.lineWidth=2.2; ctx.stroke();
    // Wavy shy squiggle
    ctx.beginPath();
    ctx.moveTo(CX-8, my+4);
    ctx.bezierCurveTo(CX-5, my+2, CX-2, my+6, CX+2, my+4);
    ctx.bezierCurveTo(CX+5, my+2, CX+7, my+5, CX+8, my+4);
    ctx.strokeStyle='rgba(192,85,95,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  } else if (expr === 'cheer') {
    // Energetic open shout
    ctx.beginPath();
    ctx.moveTo(CX-13, my);
    ctx.bezierCurveTo(CX-10, my+16, CX+10, my+16, CX+13, my);
    ctx.strokeStyle='#c0555f'; ctx.lineWidth=2.2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(CX-12, my+1);
    ctx.bezierCurveTo(CX-8, my+14, CX+8, my+14, CX+12, my+1);
    ctx.closePath(); ctx.fillStyle='#6B2737'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(CX-11, my+2);
    ctx.bezierCurveTo(CX-7, my+7, CX+7, my+7, CX+11, my+2);
    ctx.fillStyle='#fff'; ctx.fill();
  } else {
    // Neutral
    ctx.beginPath();
    ctx.moveTo(CX-9, my+4); ctx.bezierCurveTo(CX-3, my+8, CX+3, my+8, CX+9, my+4);
    ctx.strokeStyle='#c0555f'; ctx.lineWidth=2; ctx.stroke();
  }
}

// ---- Accessories ----
function drawAccessory(acc) {

    ctx.beginPath(); ctx.roundRect(lx-13, eyeY-9, 23, 17, 6);
    ctx.fillStyle=lG; ctx.fill();
    // Right lens
    ctx.beginPath(); ctx.roundRect(rx-10, eyeY-9, 23, 17, 6);
    ctx.fillStyle=lG; ctx.fill();
    // Frame outline — tortoise shell gradient
    const fG = ctx.createLinearGradient(lx-13,eyeY-9,rx+13,eyeY+8);

    ctx.strokeStyle=fG; ctx.lineWidth=2.6; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(rx-10, eyeY-9, 23, 17, 6);
    ctx.stroke();
    // Tortoise pattern dots
    ctx.fillStyle='rgba(30,15,5,0.18)';
    [[lx-8,eyeY-4,2.5],[lx-2,eyeY+2,2],[lx+4,eyeY-3,1.8],
     [rx-4,eyeY-4,2.5],[rx+2,eyeY+2,2],[rx+8,eyeY-3,1.8]].forEach(([x,y,r]) => {
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
    // Bridge
    ctx.beginPath();
    ctx.moveTo(lx+10, eyeY-1);
    ctx.bezierCurveTo(lx+13, eyeY-5, rx-13, eyeY-5, rx-10, eyeY-1);
    ctx.strokeStyle=fG; ctx.lineWidth=2; ctx.stroke();
    // Temples
    ctx.strokeStyle='#6B4820'; ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(lx-13, eyeY-2);
    ctx.bezierCurveTo(lx-17, eyeY-2, lx-20, eyeY+2, lx-22, eyeY+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx+13, eyeY-2);
    ctx.bezierCurveTo(rx+17, eyeY-2, rx+20, eyeY+2, rx+22, eyeY+6); ctx.stroke();
    // Lens glare
    ctx.beginPath(); ctx.ellipse(lx-7, eyeY-4, 3.5, 2, -0.35, 0, Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(rx+3, eyeY-4, 3.5, 2, -0.35, 0, Math.PI*2);
    ctx.fill();

  } else if (acc === 'ribbon') {
    const RX = CX + HEAD_R - 12;  // position: upper right of head
    const RY = HEAD_CY - HEAD_R + 2;
    // Cast shadow
    ctx.beginPath(); ctx.ellipse(RX+1, RY+3, 15, 7, 0.2, 0, Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fill();
    // Wing gradient
    const wG = ctx.createRadialGradient(RX-4, RY-6, 1, RX, RY, 18);
    wG.addColorStop(0,'#FFB0D8'); wG.addColorStop(0.5,'#FF6BB4'); wG.addColorStop(1,'#E0358A');
    // Left wing
    ctx.beginPath();
    ctx.moveTo(RX, RY);
    ctx.bezierCurveTo(RX-4, RY-12, RX-16, RY-14, RX-12, RY-8);
    ctx.bezierCurveTo(RX-8, RY-4, RX-2, RY-2, RX, RY);
    ctx.fillStyle=wG; ctx.fill();
    // Left wing sheen
    ctx.beginPath();
    ctx.moveTo(RX-1, RY-1);
    ctx.bezierCurveTo(RX-4, RY-10, RX-12, RY-12, RX-10, RY-7);
    ctx.strokeStyle='rgba(255,200,230,0.4)'; ctx.lineWidth=1.2; ctx.stroke();
    // Right wing
    ctx.beginPath();
    ctx.moveTo(RX, RY);
    ctx.bezierCurveTo(RX+4, RY-12, RX+16, RY-14, RX+12, RY-8);
    ctx.bezierCurveTo(RX+8, RY-4, RX+2, RY-2, RX, RY);
    ctx.fillStyle=wG; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(RX+1, RY-1);
    ctx.bezierCurveTo(RX+4, RY-10, RX+12, RY-12, RX+10, RY-7);
    ctx.strokeStyle='rgba(255,200,230,0.4)'; ctx.lineWidth=1.2; ctx.stroke();
    // Tail loops
    ctx.beginPath();
    ctx.moveTo(RX, RY); ctx.bezierCurveTo(RX-6, RY+4, RX-10, RY+12, RX-6, RY+14);
    ctx.strokeStyle='#E0358A'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(RX, RY); ctx.bezierCurveTo(RX+6, RY+4, RX+10, RY+12, RX+6, RY+14);
    ctx.stroke();
    // Center knot sphere
    const kG = ctx.createRadialGradient(RX-2, RY-2, 1, RX, RY, 6);
    kG.addColorStop(0,'#FFD4EC'); kG.addColorStop(0.5,'#FF6BB4'); kG.addColorStop(1,'#CC1870');
    ctx.beginPath(); ctx.arc(RX, RY, 6, 0, Math.PI*2);
    ctx.fillStyle=kG; ctx.fill();
    ctx.strokeStyle='rgba(180,0,80,0.3)'; ctx.lineWidth=0.8; ctx.stroke();
    // Knot specular
    ctx.beginPath(); ctx.ellipse(RX-2, RY-2, 2.5, 1.5, -0.4, 0, Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();

  } else if (acc === 'flower') {
    const FX = CX + HEAD_R - 8, FY = HEAD_CY - HEAD_R + 6;
    // Cast shadow
    ctx.beginPath(); ctx.ellipse(FX+1, FY+3, 12, 5, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fill();
    // 8 petals with two colors alternating
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const pG = ctx.createRadialGradient(
        FX+Math.cos(a)*5, FY+Math.sin(a)*5, 0,
        FX+Math.cos(a)*10, FY+Math.sin(a)*10, 8
      );
      if (i%2===0) { pG.addColorStop(0,'#FFD6E0'); pG.addColorStop(1,'#FF8FAD'); }
      else          { pG.addColorStop(0,'#FFB0CC'); pG.addColorStop(1,'#FF6B9D'); }
      ctx.beginPath();
      ctx.ellipse(FX+Math.cos(a)*9, FY+Math.sin(a)*9, 6.5, 4, a, 0, Math.PI*2);
      ctx.fillStyle=pG; ctx.fill();
    }
    // Petal outline
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.ellipse(FX+Math.cos(a)*9, FY+Math.sin(a)*9, 6.5, 4, a, 0, Math.PI*2);
      ctx.strokeStyle='rgba(220,80,120,0.2)'; ctx.lineWidth=0.8; ctx.stroke();
    }
    // Stamen center
    const cG = ctx.createRadialGradient(FX-1,FY-1,1,FX,FY,8);
    cG.addColorStop(0,'#FFFDE7'); cG.addColorStop(0.5,'#FFD54F'); cG.addColorStop(1,'#F57F17');
    ctx.beginPath(); ctx.arc(FX, FY, 8, 0, Math.PI*2);
    ctx.fillStyle=cG; ctx.fill();
    ctx.strokeStyle='rgba(180,100,0,0.25)'; ctx.lineWidth=0.8; ctx.stroke();
    // Stamen dots
    ctx.fillStyle='rgba(180,80,0,0.4)';
    for(let i=0;i<6;i++) {
      const a = i*Math.PI/3;
      ctx.beginPath(); ctx.arc(FX+Math.cos(a)*4, FY+Math.sin(a)*4, 1.2, 0, Math.PI*2); ctx.fill();
    }
    // Center specular
    ctx.beginPath(); ctx.ellipse(FX-2.5, FY-2.5, 3, 2, -0.4, 0, Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();
  }
  // Note: earring is drawn separately
}

function drawSparkles() {

// ===== Animation Loop =====
let motionTime = 0;
function applyMotion() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  const m = avatarState.motion;
  if (m === 'none') { drawAvatar(); return; }
  function tick() {
    motionTime += 0.045;
    let yOff = 0, rot = 0, sc = 1;
    if (m === 'bounce') yOff = Math.sin(motionTime * 2.5) * 9;
    else if (m === 'wave') { yOff = Math.sin(motionTime * 2) * 4; rot = Math.sin(motionTime * 3) * 0.07; }
    else if (m === 'spin') rot = motionTime * 0.045;
    else if (m === 'heartbeat') { const p = Math.abs(Math.sin(motionTime * 3)); sc = 1 + p * 0.11; }
    else if (m === 'tada') {
      yOff = Math.sin(motionTime * 4) * 6;
      rot = Math.sin(motionTime * 5) * 0.09;
      sc = 1 + Math.abs(Math.sin(motionTime * 4)) * 0.08;
    }
    drawAvatar(yOff, sc, rot, 1);
    animFrame = requestAnimationFrame(tick);
  }
  tick();
}

// ===== Past Avatars =====
function loadPastAvatars() {
  const senderId = getSenderId();
  fetch(`tables/avatars?search=${senderId}`)
    .then(r => r.json())
    .then(data => {
      const grid = document.getElementById('pastAvatarGrid');
      grid.innerHTML = `<div class="past-avatar-item new-btn" onclick="resetAvatar()" title="新しく作る">＋</div>`;
      if (data.data) {
        data.data.filter(a => a.sender_id === senderId).forEach(av => {
          const div = document.createElement('div');
          div.className = 'past-avatar-item';
          div.title = av.name || 'アバター';
          const mc = createMiniAvatarCanvas(av);
          div.appendChild(mc);
          div.onclick = () => loadAvatar(av);
          grid.appendChild(div);
        });
      }
    }).catch(() => {});
}

function getAvatarFaceEmoji(av) {
  const exprs = {happy:'😄',love:'🥰',thanks:'🙏',cool:'😎',excited:'🤩',shy:'😊',celebrate:'🎉',cheer:'💪'};
  return exprs[av.expression] || '😊';
}

function createMiniAvatarCanvas(av) {
  const mc = document.createElement('canvas');
  mc.width = 58; mc.height = 70;
  mc.style.cssText = 'width:58px;height:70px;display:block;';
  const mctx = mc.getContext('2d');
  // Save current state and temporarily override
  const prev = {...avatarState};
  avatarState.faceColor  = av.face_color  || '#FFDABB';
  avatarState.hairStyle  = av.hair_style  || 'short';
  avatarState.hairColor  = av.hair_color  || '#3D2B1F';
  avatarState.eyeStyle   = av.eye_style   || 'normal';
  avatarState.accessory  = av.accessory   || 'none';
  avatarState.outfit     = av.outfit      || 'casual';
  avatarState.expression = av.expression  || 'happy';

  // Mini draw on temp canvas at scale 0.28 (58/200)
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = 200; tempCanvas.height = 240;
  const prevCtx = ctx;  // keep reference
  // Draw full-size into tempCanvas then scale into mc
  const tctx = tempCanvas.getContext('2d');
  // Temporarily draw using shared drawAvatar but with a hidden canvas
  const origCanvas = document.getElementById('avatarCanvas');
  // Draw scaled
  const scl = 58 / 200;
  mctx.save();
  mctx.scale(scl, scl * (70/240));
  // We need to draw into mctx — use offscreen approach
  mctx.restore();

  // Simpler: draw on main canvas temporarily, capture, restore
  const savedImageData = ctx.getImageData(0, 0, 200, 240);
  drawAvatar();
  mctx.drawImage(origCanvas, 0, 0, 200, 240, 0, 0, 58, 70);
  ctx.putImageData(savedImageData, 0, 0);

  // Restore state
  Object.assign(avatarState, prev);
  return mc;
}

function loadAvatar(av) {
  avatarState.faceColor = av.face_color || '#FFDABB';
  avatarState.hairStyle = av.hair_style || 'short';
  avatarState.hairColor = av.hair_color || '#3D2B1F';
  avatarState.eyeStyle = av.eye_style || 'normal';
  avatarState.accessory = av.accessory || 'none';
  avatarState.outfit = av.outfit || 'casual';
  document.getElementById('avatarName').value = av.name || '';

  // Update UI buttons
  refreshUI();
  updatePreview();
  applyMotion();
  showToast('✨ アバターを読み込みました！');
}

function refreshUI() {
  const s = avatarState;
  const updates = [
    { id: 'faceColorRow', key: 'faceColor', type: 'color' },
    { id: 'hairStyleRow', key: 'hairStyle', type: 'btn' },
    { id: 'hairColorRow', key: 'hairColor', type: 'color' },
    { id: 'eyeStyleRow', key: 'eyeStyle', type: 'btn' },
    { id: 'accessoryRow', key: 'accessory', type: 'btn' },
    { id: 'outfitRow', key: 'outfit', type: 'btn' }
  ];
  updates.forEach(u => {
    const container = document.getElementById(u.id);
    container.querySelectorAll('.opt-btn, .color-swatch').forEach(el => {
      el.classList.toggle('active', el.dataset.val === s[u.key]);
    });
  });
}

function resetAvatar() {
  avatarState.faceColor = '#FFDABB';
  avatarState.hairStyle = 'short';
  avatarState.hairColor = '#3D2B1F';
  avatarState.eyeStyle = 'normal';
  avatarState.accessory = 'none';
  avatarState.outfit = 'casual';
  avatarState.expression = 'happy';
  avatarState.motion = 'bounce';
  document.getElementById('avatarName').value = '';
  refreshUI();
  document.querySelectorAll('.expr-btn').forEach(b => b.classList.toggle('active', b.dataset.val === 'happy'));
  document.querySelectorAll('.motion-btn').forEach(b => b.classList.toggle('active', b.dataset.val === 'bounce'));
  document.getElementById('exprDisplay').textContent = '😄';
  document.getElementById('motionLabel').textContent = 'ジャンプ中';
  updatePreview();
  applyMotion();
}

// ===== Sender ID =====
function getSenderId() {
  let id = localStorage.getItem('obt_sender_id');
  if (!id) {
    id = 'sender_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
    localStorage.setItem('obt_sender_id', id);
  }
  return id;
}

// ===== Save & Proceed =====
async function goToCheckout() {
  const senderName = document.getElementById('senderName').value.trim();
  const recipientName = document.getElementById('recipientName').value.trim();
  const avatarName = document.getElementById('avatarName').value.trim() || 'マイアバター';

  if (!senderName) { showToast('⚠️ あなたの名前を入力してください'); return; }
  if (!recipientName) { showToast('⚠️ 受け取り手の名前を入力してください'); return; }

  const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
  if (!gift.id) { showToast('⚠️ ギフトが選択されていません'); window.location.href='gift.html'; return; }

  // Save avatar to DB
  try {
    const avatarPayload = {
      sender_id: getSenderId(),
      name: avatarName,
      face_color: avatarState.faceColor,
      hair_style: avatarState.hairStyle,
      hair_color: avatarState.hairColor,
      eye_style: avatarState.eyeStyle,
      accessory: avatarState.accessory,
      outfit: avatarState.outfit,
      expression: avatarState.expression,
      motion: avatarState.motion
    };
    const res = await fetch('tables/avatars', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(avatarPayload)
    });
    const savedAvatar = await res.json();

    sessionStorage.setItem('avatarData', JSON.stringify({ ...avatarState, id: savedAvatar.id, name: avatarName }));
    sessionStorage.setItem('senderName', senderName);
    sessionStorage.setItem('recipientName', recipientName);

    window.location.href = 'checkout.html';
  } catch (e) {
    // Proceed anyway
    sessionStorage.setItem('avatarData', JSON.stringify({ ...avatarState, name: avatarName }));
    sessionStorage.setItem('senderName', senderName);
    sessionStorage.setItem('recipientName', recipientName);
    window.location.href = 'checkout.html';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== Init =====
const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
const _cartMode = sessionStorage.getItem('cartMode') || 'full';
const _allCartItems = JSON.parse(sessionStorage.getItem('allCartItems') || '[]');
const _isChoiceMode = _cartMode === 'choice' && _allCartItems.length >= 2;

if (gift.name || _allCartItems.length > 0) {
  const displayEmoji = gift.emoji || (_allCartItems[0] && _allCartItems[0].emoji) || '🎁';
  const displayName  = _isChoiceMode
    ? `選べるギフト × ${_allCartItems.length}点`
    : (gift.name || '');
  const displayPrice = _isChoiceMode
    ? (_allCartItems[0] ? _allCartItems[0].price : (gift.price || 0))
    : (gift.price || 0);
  const priceLabel = _isChoiceMode ? '（受け取り手が1点選ぶ）' : '';

  document.getElementById('giftEmojiDisplay').textContent = displayEmoji;
  document.getElementById('giftNameDisplay').textContent = displayName;
  document.getElementById('giftPriceDisplay').textContent = displayPrice
    ? '¥' + displayPrice.toLocaleString() + priceLabel
    : '';
} else {
  document.getElementById('giftNameDisplay').textContent = '未選択（ギフトを選んでください）';
  document.getElementById('giftPriceDisplay').textContent = '';
}

loadPastAvatars();
applyMotion();
</script>
