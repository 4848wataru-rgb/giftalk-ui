<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギフトが届いています！ - OKURIATO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    body {
      background: #0a0015;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Noto Sans JP', 'Nunito', sans-serif;
    }

    /* ===== Intro Screen ===== */
    #introScreen {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, #1a0030 0%, #0a0015 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 500;
      transition: opacity 0.8s ease;
    }
    #introScreen.fade-out { opacity: 0; pointer-events: none; }

    .star-field { position: absolute; inset: 0; pointer-events: none; }
    .star {
      position: absolute; background: white; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .intro-logo {
      font-size: 1.4rem; font-weight: 900;
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 32px; letter-spacing: 2px;
    }

    .gift-box-container {
      position: relative; cursor: pointer;
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }
    .gift-box-svg {
      width: 160px; height: 160px;
      filter: drop-shadow(0 0 30px rgba(255, 107, 157, 0.7));
    }

    .tap-hint {
      color: rgba(255,255,255,0.6); font-size: 0.9rem; font-weight: 600;
      margin-top: 24px; animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .sender-badge {
      position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      color: white; padding: 6px 20px; border-radius: 50px;
      font-size: 0.82rem; font-weight: 700; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(255,107,157,0.5);
    }

    /* ===== Main Content ===== */
    #mainContent {
      display: none; min-height: 100vh;
      background: linear-gradient(170deg, #1a0030 0%, #0d0020 40%, #000510 100%);
    }
    #mainContent.visible { display: block; }

    /* Stage */
    .gift-stage {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px 40px; overflow: hidden;
    }

    /* Spotlight */
    .spotlight {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse at top, rgba(168,85,247,0.25) 0%, transparent 65%);
      pointer-events: none;
    }

    /* To / From */
    .to-from {
      text-align: center; margin-bottom: 32px; z-index: 2;
      animation: slideInUp 0.7s ease forwards;
    }
    .to-text {
      font-size: 0.82rem; color: rgba(255,255,255,0.5); font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
    }
    .from-name { font-size: 1.3rem; font-weight: 900; color: white; }
    .from-name .highlight-name {
      background: linear-gradient(90deg, #FF6B9D, #A855F7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== Gift Card (no avatar) ===== */
    .gift-card-simple {
      width: 100%; max-width: 380px; z-index: 2; margin-bottom: 0;
      animation: fadeInScale 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* Gift Reveal */
    .gift-reveal-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px; overflow: hidden; margin-bottom: 20px;
      text-align: center;
    }
    .gift-big-emoji {
      font-size: 5.5rem; display: block; padding-top: 24px; margin-bottom: 16px;
      animation: bounce 1.5s ease-in-out infinite;
      filter: drop-shadow(0 4px 16px rgba(255,215,0,0.5));
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    /* 商品写真クロップ表示 */
    .rv-gift-photo {
      width: 100%; height: 200px;
      border-radius: 28px 28px 0 0;
      display: block; flex-shrink: 0;
    }
    .rv-gift-text-wrap { padding: 20px 24px 24px; }
    .rv-gift-brand {
      font-size: 0.72rem; font-weight: 700; color: #c4b5fd;
      letter-spacing: 0.5px; margin-bottom: 4px; text-transform: uppercase;
    }
    .rv-gift-desc {
      font-size: 0.82rem; color: rgba(255,255,255,0.6);
      margin-bottom: 8px; line-height: 1.5;
    }
    .gift-reveal-name { font-size: 1.3rem; font-weight: 900; color: white; margin-bottom: 6px; line-height: 1.3; }
    .gift-reveal-price {
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(90deg, #FFD700, #FF8C42);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    /* セットカード内の商品写真 */
    .set-item-photo {
      width: calc(100% + 20px); height: 100px;
      border-radius: 14px 14px 0 0;
      flex-shrink: 0;
      margin: -18px -10px 8px;
    }

    /* ===== Set choice ===== */
    .set-choice-area { width: 100%; text-align: center; }
    .set-choice-label {
      color: rgba(255,255,255,0.65); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
    }
    .set-choice-title {
      font-size: 1.15rem; font-weight: 900; color: white; margin-bottom: 20px; line-height: 1.5;
    }
    .set-cards-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;
    }
    @media (max-width: 400px) { .set-cards-grid { grid-template-columns: 1fr; gap: 10px; } }

    .set-item-card {
      background: rgba(255,255,255,0.07); backdrop-filter: blur(16px);
      border: 2px solid rgba(255,255,255,0.12); border-radius: 20px;
      padding: 18px 10px; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .set-item-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,107,157,0.15), rgba(168,85,247,0.15));
      opacity: 0; transition: opacity 0.3s;
    }
    .set-item-card:hover { border-color: rgba(255,107,157,0.5); transform: translateY(-4px) scale(1.03); }
    .set-item-card:hover::before { opacity: 1; }
    .set-item-card.selected {
      border-color: #FF6B9D; background: rgba(255,107,157,0.15);
      transform: translateY(-6px) scale(1.05);
    }
    .set-item-card.selected::before { opacity: 1; }
    .set-item-card.not-selected { opacity: 0.45; transform: scale(0.96); pointer-events: none; }
    .set-check-badge {
      position: absolute; top: 10px; right: 10px; width: 22px; height: 22px;
      border-radius: 50%; background: linear-gradient(135deg, #FF6B9D, #A855F7);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; color: white; opacity: 0; transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .set-item-card.selected .set-check-badge { opacity: 1; transform: scale(1); }
    .set-item-emoji { font-size: 2.6rem; line-height: 1; filter: drop-shadow(0 3px 8px rgba(255,215,0,0.4)); }
    .set-item-name { font-size: 0.82rem; font-weight: 800; color: white; line-height: 1.3; text-align: center; }
    .set-item-desc { font-size: 0.7rem; color: rgba(255,255,255,0.45); text-align: center; line-height: 1.4; }
    .set-item-price {
      font-size: 0.75rem; font-weight: 700;
      background: linear-gradient(90deg, #FFD700, #FF8C42);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .set-decide-btn {
      width: 100%; padding: 16px; border-radius: 50px;
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      color: white; font-size: 1rem; font-weight: 800; border: none; cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,107,157,0.45);
      transition: all 0.25s; font-family: inherit;
      opacity: 0.4; pointer-events: none; margin-bottom: 20px;
    }
    .set-decide-btn.active { opacity: 1; pointer-events: auto; }
    .set-decide-btn.active:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(255,107,157,0.55); }
    .set-result-reveal { display: none; animation: fadeInScale 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
    .set-result-reveal.show { display: block; }

    /* ===== Message card ===== */
    .message-card {
      width: 100%; max-width: 380px; z-index: 2;
      background: rgba(255,255,255,0.95);
      border-radius: 22px; padding: 22px 22px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      animation: slideInUp 0.7s 0.4s ease both;
      margin-bottom: 24px;
      position: relative;
    }
    .message-card::before {
      content: '💌';
      position: absolute; top: -14px; left: 22px;
      font-size: 1.5rem;
    }
    .message-label {
      font-size: 0.72rem; color: #aaa; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .message-text {
      font-size: 0.95rem; line-height: 1.75; color: #2D2D2D;
      font-weight: 500; white-space: pre-wrap; word-break: break-all;
    }
    .message-from {
      margin-top: 14px; padding-top: 12px; border-top: 1px solid #f0e0f0;
      font-size: 0.78rem; color: #aaa; text-align: right;
    }
    .message-from strong { color: #A855F7; }

    /* ===== Reaction Section ===== */
    .reaction-section {
      z-index: 2; width: 100%; max-width: 400px;
      text-align: center; padding-bottom: 40px;
    }
    .reaction-title {
      color: rgba(255,255,255,0.8); font-size: 0.88rem; font-weight: 700;
      margin-bottom: 14px; letter-spacing: 1px;
    }
    .reaction-emojis {
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
    }
    .reaction-emoji-btn {
      width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      font-size: 1.8rem; cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; justify-content: center;
    }
    .reaction-emoji-btn:hover, .reaction-emoji-btn.selected {
      transform: scale(1.2); border-color: var(--primary);
      background: rgba(255,107,157,0.2);
      box-shadow: 0 0 20px rgba(255,107,157,0.4);
    }
    .reaction-msg-area {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
      padding: 14px 16px; color: white; font-size: 0.9rem; font-family: inherit;
      width: 100%; outline: none; resize: none; min-height: 90px;
      margin-bottom: 14px; transition: border-color 0.2s; box-sizing: border-box;
    }
    .reaction-msg-area:focus { border-color: var(--primary); }
    .reaction-msg-area::placeholder { color: rgba(255,255,255,0.35); }
    .react-send-btn {
      width: 100%; padding: 16px; border-radius: 50px;
      background: linear-gradient(135deg, #FF6B9D, #A855F7);
      color: white; font-size: 1rem; font-weight: 800; border: none; cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,107,157,0.45);
      transition: all 0.25s; font-family: inherit;
    }
    .react-send-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(255,107,157,0.55); }
    .react-send-btn:disabled { opacity: 0.6; pointer-events: none; }

    /* Sent Reaction Confirmation */
    .reaction-sent { display: none; text-align: center; padding: 28px; animation: fadeInScale 0.5s ease forwards; }
    .reaction-sent.show { display: block; }
    .reaction-sent-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .reaction-sent-title { font-size: 1.2rem; font-weight: 800; color: white; margin-bottom: 8px; }
    .reaction-sent-sub { color: rgba(255,255,255,0.55); font-size: 0.88rem; }

    /* Decorations */
    .float-decoration {
      position: absolute; pointer-events: none; z-index: 3;
      animation: floatDeco ease-in-out infinite;
    }
    @keyframes floatDeco {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 1; }
    }

    /* Flash overlay */
    #openOverlay { position: fixed; inset: 0; background: white; z-index: 300; pointer-events: none; opacity: 0; }
    #openOverlay.flash { animation: flashAnim 0.6s ease forwards; }
    @keyframes flashAnim { 0% { opacity: 0; } 30% { opacity: 0.9; } 100% { opacity: 0; } }

    /* Loading */
    #loadingState {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background: radial-gradient(ellipse at center, #1a0030 0%, #0a0015 100%);
    }
    .load-spinner {
      width: 56px; height: 56px; border: 5px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    #errorState { display: none; }
    #errorState.show { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 40px; }

    /* Animations */
    @keyframes fadeInScale {
      from { opacity:0; transform: scale(0.7); }
      to   { opacity:1; transform: scale(1); }
    }
    @keyframes slideInUp {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 767px) {
      .set-cards-grid { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

<!-- Flash overlay -->
<div id="openOverlay"></div>

<!-- Loading State -->
<div id="loadingState">
  <div class="load-spinner"></div>
  <div style="color:rgba(255,255,255,0.6); font-weight:600;">ギフトを読み込み中...</div>
</div>

<!-- Error State -->
<div id="errorState">
  <div style="font-size:3rem; margin-bottom:16px;" id="errorIcon">😢</div>
  <h2 style="color:white; margin-bottom:8px;" id="errorTitle">ギフトが見つかりませんでした</h2>
  <p style="color:rgba(255,255,255,0.5); font-size:0.9rem; margin-bottom:24px;" id="errorDesc">URLが正しいかご確認ください</p>
  <a href="index.html" class="btn btn-primary">トップへ戻る</a>
</div>

<!-- Intro Screen -->
<div id="introScreen" style="display:none;">
  <div class="star-field" id="starField"></div>
  <div class="intro-logo">✦ OKURIATO ✦</div>
  <div style="position:relative;">
    <div class="sender-badge" id="introBadge">??? からギフトが届いています</div>
    <div class="gift-box-container" onclick="openGift()">
      <svg class="gift-box-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="72" width="120" height="72" rx="10" fill="url(#boxGrad)"/>
        <rect x="12" y="54" width="136" height="26" rx="8" fill="url(#lidGrad)"/>
        <rect x="72" y="72" width="16" height="72" fill="url(#ribbonGrad)" opacity="0.9"/>
        <rect x="12" y="63" width="136" height="8" fill="url(#ribbonGrad)" opacity="0.9"/>
        <ellipse cx="80" cy="48" rx="20" ry="12" fill="url(#bowGrad)" transform="rotate(-25 80 48)"/>
        <ellipse cx="80" cy="48" rx="20" ry="12" fill="url(#bowGrad)" transform="rotate(25 80 48)"/>
        <circle cx="80" cy="50" r="9" fill="#FF3B7A"/>
        <text x="32" y="116" font-size="18" opacity="0.7">⭐</text>
        <text x="106" y="108" font-size="14" opacity="0.6">✨</text>
        <text x="50" y="102" font-size="12" opacity="0.5">💫</text>
        <defs>
          <linearGradient id="boxGrad" x1="20" y1="72" x2="140" y2="144" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF6B9D"/>
            <stop offset="100%" stop-color="#CC3D7A"/>
          </linearGradient>
          <linearGradient id="lidGrad" x1="12" y1="54" x2="148" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF8FB0"/>
            <stop offset="100%" stop-color="#E05590"/>
          </linearGradient>
          <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#FF8C42"/>
          </linearGradient>
          <linearGradient id="bowGrad" x1="60" y1="36" x2="100" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF6B9D"/>
            <stop offset="100%" stop-color="#A855F7"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>
  <div class="tap-hint">タップして開ける 🎁</div>
</div>

<!-- Main Content -->
<div id="mainContent">
  <div class="gift-stage">
    <div class="spotlight"></div>

    <!-- Decorations -->
    <div class="float-decoration" style="top:10%; left:10%; font-size:1.4rem; animation-duration:3s;">💖</div>
    <div class="float-decoration" style="top:15%; right:12%; font-size:1.2rem; animation-duration:2.5s; animation-delay:0.5s;">⭐</div>
    <div class="float-decoration" style="top:8%; left:35%; font-size:1rem; animation-duration:4s; animation-delay:1s;">✨</div>
    <div class="float-decoration" style="top:20%; right:25%; font-size:1.6rem; animation-duration:3.5s; animation-delay:0.3s;">🌸</div>

    <!-- To / From -->
    <div class="to-from">
      <div class="to-text">✦ GIFT FOR YOU ✦</div>
      <div class="from-name">
        <span id="recipientDisplayName" class="highlight-name">あなた</span>さんへ
      </div>
      <div style="color:rgba(255,255,255,0.4); font-size:0.8rem; margin-top:4px;">
        from <span id="senderDisplayName" style="color:rgba(255,255,255,0.7); font-weight:700;">?</span>
      </div>
    </div>

    <!-- Gift Reveal (no avatar) -->
    <div class="gift-card-simple">
      <div id="giftRevealContent"><!-- JSで動的にレンダリング --></div>
    </div>

    <!-- Message Card -->
    <div class="message-card" id="messageCard" style="display:none;">
      <div class="message-label">メッセージ</div>
      <div class="speech-text message-text" id="messageText"></div>
      <div class="message-from">from <strong id="senderNameInMsg">?</strong></div>
    </div>

    <!-- Reaction Section -->
    <div class="reaction-section">
      <div class="reaction-title">💬 SEND YOUR REACTION</div>
      <div class="reaction-emojis" id="reactionEmojis">
        <button class="reaction-emoji-btn" onclick="selectReactionEmoji('🥰',this)">🥰</button>
        <button class="reaction-emoji-btn" onclick="selectReactionEmoji('😭',this)">😭</button>
        <button class="reaction-emoji-btn" onclick="selectReactionEmoji('🙏',this)">🙏</button>
        <button class="reaction-emoji-btn" onclick="selectReactionEmoji('😍',this)">😍</button>
        <button class="reaction-emoji-btn" onclick="selectReactionEmoji('🎉',this)">🎉</button>
        <button class="reaction-emoji-btn" onclick="selectReactionEmoji('💖',this)">💖</button>
      </div>

      <div id="reactionForm">
        <textarea
          class="reaction-msg-area"
          id="reactionMsg"
          placeholder="メッセージを書いてね... (任意)"
          maxlength="200"
          rows="3"
        ></textarea>
        <button class="react-send-btn" id="reactSendBtn" onclick="sendReaction()">
          💌 リアクションを送る
        </button>
      </div>

      <div class="reaction-sent" id="reactionSentMsg">
        <div class="reaction-sent-icon" id="sentReactionIcon">💖</div>
        <div class="reaction-sent-title">リアクションを送りました！</div>
        <div class="reaction-sent-sub">送り手に届きます✨</div>

        <!-- 贈り手に知らせるURL -->
        <div id="reactionShareSection" style="display:none; margin:16px 0; background:rgba(255,255,255,0.1); border-radius:16px; padding:14px 16px; text-align:left;">
          <div style="font-size:0.78rem; color:rgba(255,255,255,0.8); font-weight:800; margin-bottom:8px;">📨 贈り手にリアクションを知らせる</div>
          <div style="font-size:0.68rem; color:rgba(255,255,255,0.5); word-break:break-all; margin-bottom:10px;" id="reactionShareUrl"></div>
          <button onclick="copyReactionUrl()" style="background:linear-gradient(135deg,#FF6B9D,#A855F7);border:none;color:white;padding:9px 20px;border-radius:50px;font-size:0.8rem;font-weight:800;cursor:pointer;font-family:inherit;width:100%;">
            📋 URLをコピーして贈り手に送る
          </button>
        </div>

        <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px; align-items:center;">
          <a href="gift.html" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FF6B9D,#A855F7);color:white;font-weight:800;text-decoration:none;padding:13px 28px;border-radius:50px;font-size:0.88rem;">
            <i class="fas fa-gift"></i> ギフトを贈る
          </a>
          <button onclick="shareToFeed()" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.3);color:white;font-weight:800;padding:12px 24px;border-radius:50px;font-size:0.85rem;cursor:pointer;font-family:inherit;transition:all 0.2s;">
            <i class="fas fa-share-alt"></i> みんなに共有する
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
let orderData = null;
let selectedReactionEmoji = '';
let selectedSetIndex = -1;

// ===== Get Order ID from URL =====
function extractOrderId() {
  try {
    const v = new URLSearchParams(window.location.search).get('id');
    if (v) return v;
  } catch(e) {}
  try {
    const m = window.location.href.match(/[?&]id=([^&&#]+)/);
    if (m && m[1]) return decodeURIComponent(m[1]);
  } catch(e) {}
  try {
    const m = window.location.hash.match(/[?&]id=([^&&#]+)/);
    if (m && m[1]) return decodeURIComponent(m[1]);
  } catch(e) {}
  return null;
}
const orderId = extractOrderId();

function extractParam(key) {
  try {
    const v = new URLSearchParams(window.location.search).get(key);
    if (v !== null) return v;
  } catch(e) {}
  try {
    const m = window.location.href.match(new RegExp('[?&]' + key + '=([^&&#]*)'));
    if (m) return decodeURIComponent(m[1]);
  } catch(e) {}
  return null;
}
const isDemoMode = extractParam('demo') === '1';

// ===== Load Order =====
async function loadOrder() {
  // ① URLの ?d= パラメータにデータが埋め込まれている場合（バックエンド不要）
  try {
    const dParam = extractParam('d');
    if (dParam && dParam !== 'error') {
      // URL安全base64 (- / _) → 標準base64 (+ / /) に戻してデコード
      const b64 = dParam.replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 ? b64 + '='.repeat(4 - b64.length % 4) : b64;
      const decoded = decodeURIComponent(escape(atob(pad)));
      orderData = JSON.parse(decoded);
      showIntro();
      return;
    }
  } catch(e) {}

  // ② ローカルプレビューデータ（Giftalkプレビューボタンから）
  try {
    const preview = localStorage.getItem('giftalkPreview');
    if (preview) {
      orderData = JSON.parse(preview);
      localStorage.removeItem('giftalkPreview');
      showIntro();
      return;
    }
  } catch(e) {}

  if (isDemoMode) { loadDemoOrder(); return; }
  if (!orderId) { showError(); return; }

  try {
    const res = await fetch(`tables/orders?search=${orderId}`);
    const data = await res.json();

    if (data.data && data.data.length > 0) {
      orderData = data.data.find(o => o.id === orderId);
    }

    if (!orderData) {
      const lastId = sessionStorage.getItem('lastOrderId');
      if (lastId && lastId === orderId) {
        const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
        orderData = {
          id: orderId,
          sender_name: sessionStorage.getItem('senderName') || 'だれか',
          recipient_name: sessionStorage.getItem('recipientName') || 'あなた',
          gift_name: gift.name || 'ギフト',
          gift_emoji: gift.emoji || '🎁',
          gift_price: gift.price || 0,
          gift_is_set: gift.isSet ? 1 : 0,
          gift_set_items: gift.isSet ? JSON.stringify(gift.setItems || []) : '',
          gift_img: gift.img || '',
          gift_img_row: gift.imgRow || 0,
          gift_img_col: gift.imgCol || 0,
          gift_brand: gift.brand || '',
          gift_desc: gift.desc || '',
          message: sessionStorage.getItem('simpleMessage') || 'ありがとう！',
          status: 'pending'
        };
      }
    }

    if (!orderData) { showError(true); return; }

    // Mark as opened
    try {
      await fetch(`tables/orders/${orderData.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'opened', opened_at: Date.now() })
      });
    } catch (e) {}

    showIntro();
  } catch (e) {
    const lastId = sessionStorage.getItem('lastOrderId');
    if (lastId === orderId) {
      const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
      orderData = {
        id: orderId,
        sender_name: sessionStorage.getItem('senderName') || 'だれか',
        recipient_name: sessionStorage.getItem('recipientName') || 'あなた',
        gift_name: gift.name || 'ギフト',
        gift_emoji: gift.emoji || '🎁',
        gift_price: gift.price || 0,
        gift_is_set: gift.isSet ? 1 : 0,
        gift_set_items: gift.isSet ? JSON.stringify(gift.setItems || []) : '',
        gift_img: gift.img || '',
        gift_img_row: gift.imgRow || 0,
        gift_img_col: gift.imgCol || 0,
        gift_brand: gift.brand || '',
        gift_desc: gift.desc || '',
        message: sessionStorage.getItem('simpleMessage') || 'ありがとう！',
        status: 'pending'
      };
      showIntro();
    } else {
      showError(true); // ?id= 形式でバックエンドが繋がらない場合
    }
  }
}

// ===== Demo Order =====
function loadDemoOrder() {
  // Giftalkのプレビューデータがあれば優先して使う
  try {
    const preview = localStorage.getItem('giftalkPreview');
    if (preview) {
      orderData = JSON.parse(preview);
      localStorage.removeItem('giftalkPreview');
      showIntro();
      return;
    }
  } catch(e) {}

  // デフォルトデモデータ
  orderData = {
    id: 'demo-simple',
    sender_name: 'まこと',
    recipient_name: 'あなた',
    gift_name: 'Brew Tea Co. / ミックスボックス10コセット',
    gift_emoji: '🍵',
    gift_price: 1620,
    gift_is_set: 0,
    gift_set_items: '',
    message: 'いつもお疲れさま！\nゆっくりお茶でも飲んで休んでね🫶\nいつも応援してるよ！',
    status: 'demo'
  };
  showIntro();
}

// ===== Show Intro =====
function showIntro() {
  document.getElementById('loadingState').style.display = 'none';
  const intro = document.getElementById('introScreen');
  intro.style.display = 'flex';
  initStars();
  document.getElementById('introBadge').textContent =
    (orderData.sender_name || '???') + ' からギフトが届いています';
}

function initStars() {
  const sf = document.getElementById('starField');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      width: ${size}px; height: ${size}px;
      animation-duration: ${1 + Math.random() * 3}s;
      animation-delay: ${Math.random() * 3}s;
    `;
    sf.appendChild(s);
  }
}

// ===== Open Gift =====
function openGift() {
  const overlay = document.getElementById('openOverlay');
  overlay.classList.add('flash');
  setTimeout(() => overlay.classList.remove('flash'), 600);
  launchConfetti();
  const intro = document.getElementById('introScreen');
  intro.classList.add('fade-out');
  setTimeout(() => {
    intro.style.display = 'none';
    showMainContent();
  }, 800);
}

// ===== Show Main Content =====
function showMainContent() {
  const main = document.getElementById('mainContent');
  main.classList.add('visible');

  document.getElementById('recipientDisplayName').textContent = orderData.recipient_name || 'あなた';
  document.getElementById('senderDisplayName').textContent = orderData.sender_name || '?';

  // メッセージ表示
  const msgEl = document.getElementById('messageText');
  const msgCard = document.getElementById('messageCard');
  const senderInMsg = document.getElementById('senderNameInMsg');
  if (orderData.message) {
    msgEl.textContent = orderData.message;
    senderInMsg.textContent = orderData.sender_name || '?';
    msgCard.style.display = 'block';
  }

  // ギフト表示（三択 or 単品）
  const isChoice = orderData.cart_mode === 'choice' ||
    orderData.gift_is_set === 1 || orderData.gift_is_set === '1';
  if (isChoice) {
    renderSetChoice();
  } else {
    renderSingleGift();
  }

  setTimeout(() => launchConfetti(20), 800);
  setTimeout(() => launchConfetti(15), 1600);
}

// ============================================================
// 商品写真クロップ — gift.html と同一ロジック
// ============================================================
const IMG_META = {
  1: { w:1024, h:440, photoTop:13, photoBottom:289,
       cols:[ {x1:0, x2:340}, {x1:397, x2:672}, {x1:729, x2:1023} ] },
  2: { w:1024, h:470, photoTop:21, photoBottom:311,
       cols:[ {x1:0, x2:340}, {x1:342, x2:682}, {x1:684, x2:1023} ] },
  3: { w:1024, h:457, photoTop:17, photoBottom:307,
       cols:[ {x1:0, x2:316}, {x1:397, x2:657}, {x1:715, x2:1023} ] },
  4: { w:1024, h:483, photoTop:88, photoBottom:307,
       cols:[ {x1:0, x2:340}, {x1:342, x2:682}, {x1:684, x2:1023} ] },
};
function getImgBgStyle(img, imgRow, imgCol, cardH) {
  if (!img || !imgRow || !imgCol) return '';
  const meta = IMG_META[imgRow];
  if (!meta) return '';
  const col = meta.cols[imgCol - 1];
  if (!col) return '';
  const photoH = meta.photoBottom - meta.photoTop;
  const scale  = cardH / photoH;
  const bgW    = Math.round(meta.w * scale);
  const bgH    = Math.round(meta.h * scale);
  const cropX  = Math.round(col.x1 * scale);
  const cropY  = Math.round(meta.photoTop * scale);
  return `background-image:url('${img}');background-size:${bgW}px ${bgH}px;background-position:-${cropX}px -${cropY}px;background-repeat:no-repeat;`;
}

// ===== Single Gift Render =====
function renderSingleGift() {
  const container = document.getElementById('giftRevealContent');
  const img    = orderData.gift_img    || '';
  const imgRow = parseInt(orderData.gift_img_row) || 0;
  const imgCol = parseInt(orderData.gift_img_col) || 0;
  const bgStyle = getImgBgStyle(img, imgRow, imgCol, 200);

  const photoEl = bgStyle
    ? `<div class="rv-gift-photo" style="${bgStyle}"></div>`
    : `<span class="gift-big-emoji">${orderData.gift_emoji || '🎁'}</span>`;
  const brandEl = orderData.gift_brand
    ? `<div class="rv-gift-brand">${orderData.gift_brand}</div>` : '';
  const descEl  = orderData.gift_desc
    ? `<div class="rv-gift-desc">${orderData.gift_desc}</div>` : '';

  container.innerHTML = `
    <div class="gift-reveal-card" style="animation: fadeInScale 0.7s cubic-bezier(0.34,1.56,0.64,1) both;">
      ${photoEl}
      <div class="rv-gift-text-wrap">
        ${brandEl}
        <div class="gift-reveal-name">${orderData.gift_name || 'ギフト'}</div>
        ${descEl}
      </div>
    </div>
  `;
}

// ===== Set Gift Choice Render =====
function renderSetChoice() {
  let setItems = [];
  try {
    const raw = orderData.gift_set_items;
    // 文字列なら parse、すでに配列ならそのまま使う
    setItems = typeof raw === 'string' ? JSON.parse(raw || '[]') : (Array.isArray(raw) ? raw : []);
  } catch(e) { setItems = []; }
  // 1点以下なら単品表示にフォールバック
  if (setItems.length < 2) { renderSingleGift(); return; }

  const price = orderData.gift_price || 0;
  const container = document.getElementById('giftRevealContent');
  const SET_PHOTO_H = 100;
  const cardsHtml = setItems.map((item, i) => {
    const bgStyle = getImgBgStyle(item.img||'', parseInt(item.imgRow)||0, parseInt(item.imgCol)||0, SET_PHOTO_H);
    const photoEl = bgStyle
      ? `<div class="set-item-photo" style="${bgStyle}"></div>`
      : `<span class="set-item-emoji">${item.emoji || '🎁'}</span>`;
    return `
    <div class="set-item-card" id="setCard${i}" onclick="selectSetItem(${i})">
      <div class="set-check-badge">✓</div>
      ${photoEl}
      <div class="set-item-name">${item.name || 'ギフト' + (i+1)}</div>
      ${item.brand ? `<div class="set-item-desc" style="color:#A855F7;font-weight:700;">${item.brand}</div>` : ''}
      ${item.desc ? `<div class="set-item-desc">${item.desc}</div>` : ''}
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="set-choice-area" style="animation: slideInUp 0.7s 0.2s ease both;">
      <div class="set-choice-label">∴ 3択セットギフト</div>
      <div class="set-choice-title">🎁 3つのギフトから<br>1つ選んでね🥰</div>
      <div class="set-cards-grid">${cardsHtml}</div>
      <button class="set-decide-btn" id="setDecideBtn" onclick="decideSetChoice()">✨ これにする！</button>
    </div>
    <div class="set-result-reveal" id="setResultReveal">
      <div class="gift-reveal-card" id="chosenCard" style="padding:0;">
        <div id="chosenPhotoWrap"></div>
        <div class="rv-gift-text-wrap">
          <div id="chosenBrand" class="rv-gift-brand" style="display:none;"></div>
          <div class="gift-reveal-name" id="chosenName">ギフト</div>
          <div class="gift-reveal-price" id="chosenPrice" style="display:none;">¥0</div>
        </div>
      </div>
    </div>
  `;
}

function selectSetItem(index) {
  selectedSetIndex = index;
  document.querySelectorAll('.set-item-card').forEach((card, i) => {
    card.classList.remove('selected', 'not-selected');
    if (i === index) card.classList.add('selected');
    else card.classList.add('not-selected');
  });
  const btn = document.getElementById('setDecideBtn');
  if (btn) btn.classList.add('active');
}

function decideSetChoice() {
  if (selectedSetIndex < 0) return;
  let setItems = [];
  try { setItems = JSON.parse(orderData.gift_set_items || '[]'); } catch(e) {}
  const chosen = setItems[selectedSetIndex];
  if (!chosen) return;

  const choiceArea = document.querySelector('.set-choice-area');
  if (choiceArea) {
    choiceArea.style.transition = 'opacity 0.4s, transform 0.4s';
    choiceArea.style.opacity = '0';
    choiceArea.style.transform = 'scale(0.9)';
  }
  setTimeout(() => {
    if (choiceArea) choiceArea.style.display = 'none';
    const resultEl = document.getElementById('setResultReveal');
    const chosenBgStyle = getImgBgStyle(chosen.img||'', parseInt(chosen.imgRow)||0, parseInt(chosen.imgCol)||0, 200);
    const photoWrap = document.getElementById('chosenPhotoWrap');
    if (chosenBgStyle) {
      photoWrap.innerHTML = `<div class="rv-gift-photo" style="${chosenBgStyle}"></div>`;
    } else {
      photoWrap.innerHTML = `<span class="gift-big-emoji" style="display:block;padding-top:24px;">${chosen.emoji||'🎁'}</span>`;
    }
    const brandEl = document.getElementById('chosenBrand');
    if (chosen.brand) { brandEl.textContent = chosen.brand; brandEl.style.display = 'block'; }
    document.getElementById('chosenName').textContent  = chosen.name  || 'ギフト';
    document.getElementById('chosenPrice').textContent = '¥' + (chosen.price || orderData.gift_price || 0).toLocaleString();
    resultEl.classList.add('show');
    try {
      fetch(`tables/orders/${orderData.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chosen_item_name: chosen.name, chosen_item_emoji: chosen.emoji, chosen_item_index: selectedSetIndex, status: 'chosen' })
      });
    } catch(e) {}
    launchConfetti(40);
    showToast('🎉 ' + (chosen.name || 'ギフト') + 'を選びました！');
  }, 450);
}

// ===== Reaction =====
function selectReactionEmoji(emoji, el) {
  selectedReactionEmoji = emoji;
  document.querySelectorAll('.reaction-emoji-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

async function sendReaction() {
  if (!selectedReactionEmoji) {
    showToast('⚠️ リアクション絵文字を選んでください');
    return;
  }
  const btn = document.getElementById('reactSendBtn');
  btn.disabled = true;
  btn.textContent = '送信中...';
  const msg = document.getElementById('reactionMsg').value.trim();

  const reactionData = {
    order_id: orderData.id,
    reaction_emoji: selectedReactionEmoji,
    message: msg,
    recipient_name: orderData.recipient_name || 'ゲスト',
    created_at: Date.now()
  };

  // バックエンドへ送信を試みる（失敗しても続行）
  try {
    await fetch('tables/reactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reactionData)
    });
    fetch(`tables/orders/${orderData.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'reacted' })
    }).catch(() => {});
  } catch (e) {}

  // ① ローカルストレージに保存（同デバイス確認用）
  try {
    localStorage.setItem('okuriato_reaction_' + orderData.id, JSON.stringify(reactionData));
  } catch(e) {}

  // ② クロスデバイス用リアクションURLを生成
  try {
    const raw = btoa(unescape(encodeURIComponent(JSON.stringify(reactionData))));
    const encoded = raw.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    const base = window.location.href.split('/').slice(0, -1).join('/') + '/';
    const reactionUrl = base + 'reactions.html?r=' + encoded;
    document.getElementById('reactionShareUrl').textContent = reactionUrl;
    document.getElementById('reactionShareSection').style.display = 'block';
    window._reactionUrl = reactionUrl;
  } catch(e) {}

  document.getElementById('reactionForm').style.display = 'none';
  document.getElementById('sentReactionIcon').textContent = selectedReactionEmoji;
  document.getElementById('reactionSentMsg').classList.add('show');
  launchConfetti(30);
  showToast('💌 リアクションを送りました！');
}

function copyReactionUrl() {
  const url = window._reactionUrl || document.getElementById('reactionShareUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    showToast('✅ URLをコピーしました！贈り手に送ってください');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ URLをコピーしました！');
  });
}

// ===== Confetti =====
function launchConfetti(count = 50) {
  const colors = ['#FF6B9D','#A855F7','#FFD700','#FF8C42','#4CAF50','#64B5F6','#FF3B7A'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.style.cssText = `
        position:fixed; left:${Math.random()*100}vw; top:-10px;
        width:${5+Math.random()*8}px; height:${5+Math.random()*8}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        border-radius:${Math.random()>0.5?'50%':'2px'}; z-index:9999;
        pointer-events:none;
        animation:confettiFall ${2+Math.random()*2}s ${Math.random()*0.5}s linear forwards;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }, i * 40);
  }
}

function showError(isExpired) {
  document.getElementById('loadingState').style.display = 'none';
  if (isExpired) {
    document.getElementById('errorIcon').textContent  = '🔗';
    document.getElementById('errorTitle').textContent = 'リンクの有効期限が切れています';
    document.getElementById('errorDesc').textContent  =
      '古い形式のURLのため、ギフトを取得できませんでした。\n贈り手に新しいリンクを発行してもらってください。';
  }
  document.getElementById('errorState').classList.add('show');
  document.getElementById('errorState').style.display = 'flex';
}

function shareToFeed() {
  if (!orderData) return;
  // 受け取ったギフト情報をsessionStorageに保存してcommunityへ
  sessionStorage.setItem('communityShareGift', JSON.stringify({
    gift_name:  orderData.gift_name  || 'ギフト',
    gift_emoji: orderData.gift_emoji || '🎁',
    sender:     orderData.sender_name || '',
    recipient:  orderData.recipient_name || '',
  }));
  window.location.href = 'community.html?share=1';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ===== Init =====
loadOrder();
</script>
</body>
</html>
