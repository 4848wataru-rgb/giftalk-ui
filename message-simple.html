<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージを書く — OKURIATO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #F3E8FF 0%, #FFF0F8 100%); min-height: 100vh; }
    .page-wrapper { max-width: 680px; margin: 0 auto; padding: 28px 20px 120px; }

    /* ===== Steps ===== */
    .steps-bar { display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:32px; }
    .s-item { display:flex; flex-direction:column; align-items:center; gap:5px; }
    .s-num { width:38px; height:38px; border-radius:50%; background:#e0e0e0; color:#aaa; font-weight:800; font-size:0.95rem; display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
    .s-item.active .s-num { background:var(--gradient); color:white; box-shadow:0 4px 12px rgba(255,107,157,0.4); }
    .s-item.done .s-num { background:#4CAF50; color:white; }
    .s-label { font-size:0.7rem; color:#aaa; font-weight:700; white-space:nowrap; }
    .s-item.active .s-label, .s-item.done .s-label { color:var(--primary); }
    .s-line { width:40px; height:2px; background:#e0e0e0; margin-bottom:20px; flex-shrink:0; }

    /* ===== Panel ===== */
    .panel { background:white; border-radius:24px; box-shadow:var(--shadow-card); padding:28px; margin-bottom:20px; }
    .panel-title { font-size:1rem; font-weight:800; margin-bottom:18px; display:flex; align-items:center; gap:8px; }

    /* ===== Summary Card ===== */
    .summary-row { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid #f5f5f5; }
    .summary-row:last-child { border-bottom:none; }
    .summary-icon { width:48px; height:48px; border-radius:14px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; }
    .summary-key { font-size:0.78rem; color:var(--text-light); font-weight:700; margin-bottom:2px; }
    .summary-val { font-weight:700; font-size:0.95rem; }

    /* ===== お名前入力 ===== */
    .name-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:0; }
    .name-field label { font-size:0.78rem; font-weight:700; color:var(--text-light); margin-bottom:6px; display:block; }
    .name-field input {
      width:100%; padding:12px 14px;
      border:2px solid #eee; border-radius:14px;
      font-size:0.92rem; font-family:inherit; outline:none;
      transition:border-color 0.2s; box-sizing:border-box;
    }
    .name-field input:focus { border-color:var(--primary); }

    /* ===== Message textarea ===== */
    .message-area {
      width:100%; min-height:130px;
      padding:14px 16px;
      border:2px solid #eee; border-radius:16px;
      font-size:0.92rem; font-family:inherit;
      outline:none; resize:vertical;
      transition:border-color 0.2s; line-height:1.7;
      box-sizing:border-box;
    }
    .message-area:focus { border-color:var(--primary); }
    .char-count { font-size:0.75rem; color:var(--text-light); text-align:right; margin-top:6px; }

    /* ===== Quick message chips ===== */
    .quick-msg-row {
      display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;
    }
    .qm-chip {
      padding:7px 14px; border-radius:50px;
      font-size:0.78rem; font-weight:700; cursor:pointer;
      border:2px solid #e8d8ff; background:white; color:#A855F7;
      transition:all 0.2s; font-family:inherit;
    }
    .qm-chip:hover { background:#f5ecff; border-color:#A855F7; }

    /* ===== No avatar badge ===== */
    .no-avatar-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:linear-gradient(135deg,#f0e8ff,#ffe8f5);
      border:1.5px solid #d4b8f0; border-radius:12px;
      padding:10px 16px; font-size:0.82rem; font-weight:700; color:#A855F7;
      margin-bottom:18px; width:100%; box-sizing:border-box;
    }

    /* ===== Bottom bar ===== */
    .bottom-bar { position:fixed; bottom:0; left:0; right:0; background:white; box-shadow:0 -4px 24px rgba(0,0,0,0.09); padding:14px 24px; z-index:200; }
    .bottom-bar-inner { max-width:680px; margin:0 auto; display:flex; gap:12px; align-items:center; }

    /* ===== Responsive ===== */
    @media (max-width:767px) {
      .page-wrapper { padding:20px 14px 120px; }
      .s-num { width:30px; height:30px; font-size:0.8rem; }
      .s-label { font-size:0.62rem; }
      .s-line { width:20px; }
      .panel { padding:18px 14px; border-radius:18px; }
      .name-row { grid-template-columns:1fr; gap:10px; }
      .bottom-bar { padding:10px 14px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      
      <span class="logo-text">OKURIATO</span>
    </a>
    <nav class="header-nav">
      <a href="community.html" class="btn btn-outline"><i class="fas fa-users"></i> みんなの投稿</a>
      <a href="giftalk.html" class="btn btn-outline" style="border-color:var(--secondary);color:var(--secondary);"><i class="fas fa-robot"></i> Giftalk</a>
    </nav>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleDrawer()" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="nav-drawer" id="navDrawer">
  <div class="nav-drawer-backdrop" onclick="closeDrawer()"></div>
  <div class="nav-drawer-panel">
    <a href="gift.html" class="nav-drawer-link primary"><i class="fas fa-gift"></i> ギフトを贈る</a>
    <a href="community.html" class="nav-drawer-link"><i class="fas fa-users"></i> みんなの投稿</a>
    <a href="giftalk.html" class="nav-drawer-link" style="color:var(--secondary);"><i class="fas fa-robot"></i> Giftalk</a>
    <a href="index.html" class="nav-drawer-link"><i class="fas fa-home"></i> トップ</a>
  </div>
</div>

<div class="page-wrapper">

  <!-- Steps (アバターなし：ギフト選択→メッセージ→確認・送信) -->
  <div class="steps-bar">
    <div class="s-item done"><div class="s-num"><i class="fas fa-check" style="font-size:0.8rem;"></i></div><div class="s-label">ギフト選択</div></div>
    <div class="s-line"></div>
    <div class="s-item active"><div class="s-num">2</div><div class="s-label">メッセージ</div></div>
    <div class="s-line"></div>
    <div class="s-item" id="step3Item"><div class="s-num">3</div><div class="s-label">確認・送信</div></div>
  </div>

  <!-- アバターなし表示 -->
  <div class="no-avatar-badge">
    <span>🎁</span>
    <span>アバターなしモード — ギフトとメッセージだけで贈ります</span>
  </div>

  <!-- お名前入力 -->
  <div class="panel">
    <div class="panel-title">👤 送り手と受け取り手のお名前</div>
    <div class="name-row">
      <div class="name-field">
        <label for="senderInput">あなたのお名前（送り手）</label>
        <input type="text" id="senderInput" placeholder="例：まこと" maxlength="20">
      </div>
      <div class="name-field">
        <label for="recipientInput">受け取り手のお名前</label>
        <input type="text" id="recipientInput" placeholder="例：あやか" maxlength="20">
      </div>
    </div>
  </div>

  <!-- ギフト内容確認 -->
  <div class="panel">
    <div class="panel-title">🎁 ギフト内容</div>
    <div class="summary-row">
      <div class="summary-icon" id="sumGiftEmoji">🎁</div>
      <div style="flex:1;">
        <div class="summary-key">ギフト</div>
        <div class="summary-val" id="sumGiftName">—</div>
      </div>
      <div style="font-weight:800; color:var(--primary);" id="sumGiftPrice">—</div>
    </div>
  </div>

  <!-- メッセージ入力 -->
  <div class="panel">
    <div class="panel-title">💌 メッセージを書こう</div>

    <!-- クイックメッセージ -->
    <div class="quick-msg-row" id="quickMsgRow">
      <button class="qm-chip" onclick="insertQuickMsg('いつもありがとう！💕')">いつもありがとう</button>
      <button class="qm-chip" onclick="insertQuickMsg('お誕生日おめでとう🎂')">誕生日おめでとう</button>
      <button class="qm-chip" onclick="insertQuickMsg('お疲れさま、ゆっくり休んでね🫶')">お疲れさま</button>
      <button class="qm-chip" onclick="insertQuickMsg('いつも応援してるよ！💪')">応援してるよ</button>
      <button class="qm-chip" onclick="insertQuickMsg('笑顔でいてくれてありがとう😊')">笑顔に感謝</button>
      <button class="qm-chip" onclick="insertQuickMsg('少しだけど気持ちを込めたよ🎁')">気持ちを込めて</button>
    </div>

    <textarea
      class="message-area"
      id="messageInput"
      maxlength="300"
      placeholder="例：いつもありがとう！笑顔が大好きだよ💕&#10;お誕生日おめでとう🎂"
      oninput="updateCharCount()"
    ></textarea>
    <div class="char-count"><span id="charCount">0</span> / 300</div>
  </div>

</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <button class="btn btn-outline" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> 戻る
    </button>
    <button class="btn btn-primary" style="flex:1; justify-content:center;" onclick="goNext()">
      お支払いへ <i class="fas fa-arrow-right"></i>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
const _cartMode    = sessionStorage.getItem('cartMode') || 'full';
const _allCartItems = JSON.parse(sessionStorage.getItem('allCartItems') || '[]');
const _isChoiceMode = _cartMode === 'choice' && _allCartItems.length >= 2;

// ===== Init =====
function init() {
  const displayPrice = _isChoiceMode
    ? (_allCartItems[0] ? _allCartItems[0].price : (gift.price || 0))
    : (gift.price || 0);
  const priceLabel = _isChoiceMode ? '（1点分）' : '';

  document.getElementById('sumGiftEmoji').textContent = gift.emoji || '🎁';
  document.getElementById('sumGiftName').textContent = _isChoiceMode
    ? `選べるギフト × ${_allCartItems.length}点`
    : (gift.name || '—');
  document.getElementById('sumGiftPrice').textContent = displayPrice
    ? '¥' + displayPrice.toLocaleString() + priceLabel
    : '—';

  // 保存済みの名前を復元
  const savedSender = sessionStorage.getItem('senderName') || '';
  const savedRecipient = sessionStorage.getItem('recipientName') || '';
  if (savedSender) document.getElementById('senderInput').value = savedSender;
  if (savedRecipient) document.getElementById('recipientInput').value = savedRecipient;

  // 保存済みメッセージを復元
  const savedMsg = sessionStorage.getItem('simpleMessage') || '';
  if (savedMsg) {
    document.getElementById('messageInput').value = savedMsg;
    updateCharCount();
  }

  if (!gift.id) {
    showToast('⚠️ ギフトが選択されていません。ギフト選択ページへ戻ってください。');
  }
}

// ===== Quick Message Insert =====
function insertQuickMsg(text) {
  const ta = document.getElementById('messageInput');
  const cur = ta.value;
  // 末尾に追加（空なら直接）
  ta.value = cur ? cur + '\n' + text : text;
  updateCharCount();
  ta.focus();
}

// ===== Char Count =====
function updateCharCount() {
  const v = document.getElementById('messageInput').value;
  document.getElementById('charCount').textContent = v.length;
}

// ===== Navigation =====
function goBack() {
  window.location.href = 'gift.html';
}

function goNext() {
  const sender = document.getElementById('senderInput').value.trim();
  const recipient = document.getElementById('recipientInput').value.trim();
  const msg = document.getElementById('messageInput').value.trim();

  if (!sender) { showToast('⚠️ 送り手のお名前を入力してください'); return; }
  if (!recipient) { showToast('⚠️ 受け取り手のお名前を入力してください'); return; }
  if (!msg) { showToast('⚠️ メッセージを入力してください'); return; }

  // sessionStorage に保存
  sessionStorage.setItem('senderName', sender);
  sessionStorage.setItem('recipientName', recipient);
  sessionStorage.setItem('simpleMessage', msg);
  // 三択モード情報を引き継ぐ
  sessionStorage.setItem('cartMode', _cartMode);
  sessionStorage.setItem('allCartItems', JSON.stringify(_allCartItems));

  window.location.href = 'checkout-simple.html';
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
<script>
function toggleDrawer(){const d=document.getElementById('navDrawer'),h=document.getElementById('navHamburger');d.classList.toggle('open');h.classList.toggle('open');document.body.style.overflow=d.classList.contains('open')?'hidden':'';}
function closeDrawer(){const d=document.getElementById('navDrawer'),h=document.getElementById('navHamburger');d.classList.remove('open');h.classList.remove('open');document.body.style.overflow='';}
</script>
</body>
</html>
