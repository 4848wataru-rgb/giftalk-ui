<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアクション確認 - OKURIATO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #FFF0F8 0%, #F3E8FF 100%); min-height: 100vh; }
    .page-wrapper { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

    /* Hero */
    .page-hero {
      text-align: center;
      margin-bottom: 36px;
    }
    .page-hero-icon {
      font-size: 3.5rem;
      margin-bottom: 12px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }
    .page-hero h1 {
      font-size: 1.7rem;
      font-weight: 900;
      margin-bottom: 8px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-hero p {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 18px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .stat-num {
      font-size: 2rem;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--text-light);
      font-weight: 700;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .f-tab {
      padding: 7px 18px;
      border-radius: 50px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid #eee;
      background: white;
      color: var(--text-light);
      transition: all 0.2s;
      font-family: inherit;
    }
    .f-tab.active {
      background: var(--gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255,107,157,0.3);
    }

    /* Order Card */
    .order-card {
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .order-card:hover { transform: translateY(-2px); }

    .order-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
    }
    .order-gift-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
      flex-shrink: 0;
    }
    .order-info { flex: 1; }
    .order-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; }
    .order-meta { font-size: 0.76rem; color: var(--text-light); display: flex; gap: 10px; flex-wrap: wrap; }
    .order-status {
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .status-pending { background: #FFF3E0; color: #FF8C00; }
    .status-opened { background: #E8F5E9; color: #2E7D32; }
    .status-reacted { background: #F3E5F5; color: #6A1B9A; }

    /* Reaction Body */
    .order-reaction {
      padding: 16px 20px;
      background: linear-gradient(135deg, #FFF5F8, #F8F0FF);
    }
    .reaction-header {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .reaction-content {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .reaction-big-emoji {
      font-size: 2.5rem;
      flex-shrink: 0;
      animation: heartbeat 1.5s ease-in-out infinite;
    }
    .reaction-msg-text {
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      flex: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .reaction-from {
      font-size: 0.72rem;
      color: var(--text-light);
      margin-top: 8px;
      font-weight: 600;
    }
    .no-reaction-yet {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-light);
      font-size: 0.85rem;
    }

    /* Share URL row */
    .order-url-row {
      padding: 12px 20px;
      border-top: 1px solid #f5f5f5;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .order-url-text {
      flex: 1;
      font-size: 0.75rem;
      color: var(--text-light);
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-copy-btn {
      padding: 5px 12px;
      border-radius: 50px;
      background: var(--bg2);
      color: var(--secondary);
      font-size: 0.75rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .mini-copy-btn:hover { background: var(--secondary); color: white; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-title { font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .empty-sub { color: var(--text-light); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }
    .mini-spinner {
      width: 40px; height: 40px;
      border: 4px solid #eee;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    /* New reaction badge */
    .new-badge {
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.68rem;
      font-weight: 800;
      margin-left: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Toggle arrow */
    .toggle-arrow {
      color: var(--text-light);
      transition: transform 0.3s;
      font-size: 0.8rem;
    }
    .order-card.expanded .toggle-arrow { transform: rotate(180deg); }
    .order-details { display: none; }
    .order-card.expanded .order-details { display: block; }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-num { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      
      <span class="logo-text">OKURIATO</span>
    </a>
    <nav class="header-nav">
      <a href="community.html" class="btn btn-outline"><i class="fas fa-users"></i> みんなの投稿</a>
      <a href="giftalk.html" class="btn btn-outline" style="border-color:var(--secondary);color:var(--secondary);"><i class="fas fa-robot"></i> Giftalk</a>
      <a href="gift.html" class="btn btn-primary">
        <i class="fas fa-plus"></i> 新しいギフトを贈る
      </a>
    </nav>
    <button class="nav-hamburger" id="navHamburger" onclick="toggleDrawer()" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="nav-drawer" id="navDrawer">
  <div class="nav-drawer-backdrop" onclick="closeDrawer()"></div>
  <div class="nav-drawer-panel">
    <a href="gift.html" class="nav-drawer-link primary"><i class="fas fa-plus"></i> 新しいギフトを贈る</a>
    <a href="community.html" class="nav-drawer-link"><i class="fas fa-users"></i> みんなの投稿</a>
    <a href="giftalk.html" class="nav-drawer-link" style="color:var(--secondary);"><i class="fas fa-robot"></i> Giftalk</a>
    <a href="index.html" class="nav-drawer-link"><i class="fas fa-home"></i> トップ</a>
  </div>
</div>

<div class="page-wrapper">

  <div class="page-hero">
    <span class="page-hero-icon">💌</span>
    <h1>リアクション確認</h1>
    <p>受け取り手からのリアクション・メッセージを確認できます</p>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">合計ギフト</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statOpened">0</div>
      <div class="stat-label">開封済み</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statReacted">0</div>
      <div class="stat-label">リアクション</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="f-tab active" onclick="setFilter('all',this)">🌟 すべて</button>
    <button class="f-tab" onclick="setFilter('pending',this)">📦 未開封</button>
    <button class="f-tab" onclick="setFilter('opened',this)">✉️ 開封済み</button>
    <button class="f-tab" onclick="setFilter('reacted',this)">💬 リアクションあり</button>
  </div>

  <!-- Orders List -->
  <div id="ordersList">
    <div class="loading-state">
      <div class="mini-spinner"></div>
      <p style="color:var(--text-light); font-size:0.9rem;">読み込み中...</p>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let allOrders = [];
let allReactions = [];
let currentFilter = 'all';
const senderId = getSenderId();

function getSenderId() {
  let id = localStorage.getItem('obt_sender_id');
  if (!id) {
    id = 'sender_' + Date.now();
    localStorage.setItem('obt_sender_id', id);
  }
  return id;
}

// ===== Load Data =====
async function loadData() {
  try {
    // Load orders for this sender
    const ordersRes = await fetch(`tables/orders?limit=100`);
    const ordersData = await ordersRes.json();
    const allDbOrders = (ordersData.data || []).filter(o => o.sender_id === senderId);

    // Also check sessionStorage for demo purposes
    const lastOrderId = sessionStorage.getItem('lastOrderId');
    const lastShareUrl = sessionStorage.getItem('lastShareUrl');
    if (lastOrderId && !allDbOrders.find(o => o.id === lastOrderId)) {
      const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
      const _cartMode = sessionStorage.getItem('cartMode') || 'full';
      const _allItems = JSON.parse(sessionStorage.getItem('allCartItems') || '[]');
      const _isChoice = _cartMode === 'choice' && _allItems.length >= 2;
      const _price    = _isChoice ? (_allItems[0] ? _allItems[0].price : gift.price || 0) : (gift.price || 0);
      const _label    = _isChoice ? '（1点分）' : '';
      allDbOrders.unshift({
        id: lastOrderId,
        sender_id: senderId,
        sender_name: sessionStorage.getItem('senderName') || 'あなた',
        recipient_name: sessionStorage.getItem('recipientName') || '受け取り手',
        gift_name: _isChoice ? `選べるギフト × ${_allItems.length}点` : (gift.name || 'ギフト'),
        gift_emoji: gift.emoji || (_allItems[0] && _allItems[0].emoji) || '🎁',
        gift_price: _price,
        gift_price_label: _label,
        share_url: lastShareUrl || '',
        status: 'pending',
        created_at: Date.now()
      });
    }

    allOrders = allDbOrders;

    // サーバーからリアクション取得、失敗時は localStorage
    try {
      const reactRes = await fetch(`tables/reactions?limit=200`);
      const reactData = await reactRes.json();
      allReactions = reactData.data || [];
    } catch(e) {
      allReactions = loadLocalReactions(allOrders.map(o => o.id));
    }
    // URLパラメータのリアクションも追加
    const urlReaction = extractReactionFromUrl();
    if (urlReaction && !allReactions.find(r => r.order_id === urlReaction.order_id)) {
      allReactions.push(urlReaction);
      const order = allOrders.find(o => o.id === urlReaction.order_id);
      if (order) order.status = 'reacted';
      try { localStorage.setItem('okuriato_reaction_' + urlReaction.order_id, JSON.stringify(urlReaction)); } catch(e) {}
    }
    renderAll();
  } catch (e) {
    // Fallback: sessionStorage のオーダーを表示
    const lastOrderId = sessionStorage.getItem('lastOrderId');
    if (lastOrderId) {
      const gift = JSON.parse(sessionStorage.getItem('selectedGift') || '{}');
      allOrders = [{
        id: lastOrderId,
        sender_id: senderId,
        sender_name: sessionStorage.getItem('senderName') || 'あなた',
        recipient_name: sessionStorage.getItem('recipientName') || '受け取り手',
        gift_name: (function(){
          const _m=sessionStorage.getItem('cartMode')||'full';
          const _a=JSON.parse(sessionStorage.getItem('allCartItems')||'[]');
          return (_m==='choice'&&_a.length>=2)?`選べるギフト × ${_a.length}点`:(gift.name||'ギフト');
        })(),
        gift_emoji: gift.emoji || '🎁',
        gift_price: (function(){
          const _m=sessionStorage.getItem('cartMode')||'full';
          const _a=JSON.parse(sessionStorage.getItem('allCartItems')||'[]');
          return (_m==='choice'&&_a.length>=2&&_a[0])?_a[0].price:(gift.price||0);
        })(),
        gift_price_label: sessionStorage.getItem('cartMode')==='choice'?'（1点分）':'',
        share_url: sessionStorage.getItem('lastShareUrl') || '',
        status: 'pending',
        created_at: Date.now()
      }];
    }
    // localStorage のリアクションを取得
    allReactions = loadLocalReactions(allOrders.map(o => o.id));
  }
  // URLパラメータのリアクションを追加（クロスデバイス）
  const urlReaction = extractReactionFromUrl();
  if (urlReaction) {
    const already = allReactions.find(r => r.order_id === urlReaction.order_id);
    if (!already) allReactions.push(urlReaction);
    // 対応オーダーのステータスを更新
    const order = allOrders.find(o => o.id === urlReaction.order_id);
    if (order) order.status = 'reacted';
    // localStorage にも保存
    try { localStorage.setItem('okuriato_reaction_' + urlReaction.order_id, JSON.stringify(urlReaction)); } catch(e) {}
  }
  renderAll();
}

function loadLocalReactions(orderIds) {
  const reactions = [];
  orderIds.forEach(id => {
    try {
      const raw = localStorage.getItem('okuriato_reaction_' + id);
      if (raw) reactions.push(JSON.parse(raw));
    } catch(e) {}
  });
  return reactions;
}

function extractReactionFromUrl() {
  try {
    const rParam = new URLSearchParams(window.location.search).get('r');
    if (!rParam) return null;
    const b64 = rParam.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4 ? b64 + '='.repeat(4 - b64.length % 4) : b64;
    return JSON.parse(decodeURIComponent(escape(atob(pad))));
  } catch(e) { return null; }
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.f-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

function renderAll() {
  // Stats
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statOpened').textContent = allOrders.filter(o => o.status === 'opened' || o.status === 'reacted').length;
  document.getElementById('statReacted').textContent = allOrders.filter(o => o.status === 'reacted').length;

  // Filter
  let filtered = allOrders;
  if (currentFilter !== 'all') {
    filtered = allOrders.filter(o => o.status === currentFilter);
  }

  const container = document.getElementById('ordersList');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${currentFilter === 'all' ? '🎁' : currentFilter === 'pending' ? '📦' : currentFilter === 'opened' ? '✉️' : '💬'}</div>
        <div class="empty-title">${currentFilter === 'all' ? 'まだギフトを贈っていません' : '該当するギフトがありません'}</div>
        <div class="empty-sub">${currentFilter === 'all' ? 'ギフトを贈るとここで確認できます\nリアクションが届いたら通知されます' : ''}</div>
        ${currentFilter === 'all' ? '<a href="gift.html" class="btn btn-primary btn-lg"><i class="fas fa-gift"></i> ギフトを贈る</a>' : ''}
      </div>
    `;
    return;
  }

  container.innerHTML = filtered
    .sort((a, b) => (b.created_at || 0) - (a.created_at || 0))
    .map(order => renderOrderCard(order))
    .join('');
}

function renderOrderCard(order) {
  const reactions = allReactions.filter(r => r.order_id === order.id);
  const hasNewReaction = reactions.length > 0;
  const statusLabel = { pending: '未開封', opened: '開封済み', reacted: 'リアクションあり' }[order.status] || order.status;
  const statusClass = 'status-' + (order.status || 'pending');
  const shareUrl = order.share_url || (window.location.origin + window.location.pathname.replace('reactions.html','') + 'receive.html?id=' + order.id);
  const createdAt = order.created_at ? new Date(order.created_at).toLocaleDateString('ja-JP', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

  return `
    <div class="order-card" id="card-${order.id}">
      <div class="order-header" onclick="toggleCard('${order.id}')">
        <div class="order-gift-icon">${order.gift_emoji || '🎁'}</div>
        <div class="order-info">
          <div class="order-title">
            ${order.gift_name || 'ギフト'}
            ${hasNewReaction ? '<span class="new-badge">NEW 💬</span>' : ''}
          </div>
          <div class="order-meta">
            <span>🎯 ${order.recipient_name || '受け取り手'}</span>
            <span>¥${(order.gift_price || 0).toLocaleString()}${order.gift_price_label || ''}</span>
            ${createdAt ? `<span>📅 ${createdAt}</span>` : ''}
          </div>
        </div>
        <div class="order-status ${statusClass}">${statusLabel}</div>
        <i class="fas fa-chevron-down toggle-arrow" style="margin-left:6px;"></i>
      </div>

      <div class="order-details">
        <!-- Reaction(s) -->
        <div class="order-reaction">
          <div class="reaction-header">💬 リアクション</div>
          ${reactions.length > 0
            ? reactions.map(r => `
                <div class="reaction-content" style="margin-bottom:10px;">
                  <div class="reaction-big-emoji">${r.reaction_emoji || '💖'}</div>
                  <div>
                    <div class="reaction-msg-text">${r.message || '（メッセージなし）'}</div>
                    <div class="reaction-from">from ${r.recipient_name || '受け取り手'}</div>
                  </div>
                </div>
              `).join('')
            : `<div class="no-reaction-yet">
                <span style="font-size:1.3rem;">⏳</span>
                <span>まだリアクションがありません。相手が開封後に届きます。</span>
              </div>`
          }
        </div>

        <!-- Share URL -->
        <div class="order-url-row">
          <div style="font-size:0.72rem; color:var(--text-light); font-weight:700; white-space:nowrap;">共有URL:</div>
          <div class="order-url-text">${shareUrl}</div>
          <button class="mini-copy-btn" onclick="copyOrderUrl('${shareUrl}', event)">
            <i class="fas fa-copy"></i> コピー
          </button>
          <a href="${shareUrl}" target="_blank" class="mini-copy-btn" style="text-decoration:none; margin-left:4px;">
            <i class="fas fa-external-link-alt"></i> 開く
          </a>
        </div>
      </div>
    </div>
  `;
}

function toggleCard(orderId) {
  const card = document.getElementById('card-' + orderId);
  card.classList.toggle('expanded');
}

function copyOrderUrl(url, e) {
  e.stopPropagation();
  navigator.clipboard.writeText(url).then(() => {
    showToast('✅ URLをコピーしました！');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ URLをコピーしました！');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Auto-refresh every 15 seconds
setInterval(loadData, 15000);

// Init
loadData();
</script>
<script>
function toggleDrawer(){const d=document.getElementById('navDrawer'),h=document.getElementById('navHamburger');d.classList.toggle('open');h.classList.toggle('open');document.body.style.overflow=d.classList.contains('open')?'hidden':'';}
function closeDrawer(){const d=document.getElementById('navDrawer'),h=document.getElementById('navHamburger');d.classList.remove('open');h.classList.remove('open');document.body.style.overflow='';}
</script>
</body>
</html>
